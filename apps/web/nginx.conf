server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep only Conversation and task SSE unbuffered; preserve ordinary API policy.
    location ~ ^/api/(v[12]/conversations/[^/]+/events|v1/conversations/[^/]+/tasks/[^/]+/events)$ {
        proxy_buffering off;
        # Nginx consumes upstream X-Accel-* headers. Send the same hint to the Ingress.
        add_header X-Accel-Buffering no;
        proxy_read_timeout 150s;
        proxy_next_upstream off;
        proxy_pass http://agent-infra-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $ack_proxy_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Platform-Proxy-Token "__PLATFORM_PROXY_TOKEN__";
    }

    # The deployment fixes this one registered callback path; other API logs stay unchanged.
    location = "__PLATFORM_CONNECTION_CALLBACK_PATH__" {
        access_log /dev/stdout auth_route;
        error_log /dev/null crit;
        proxy_read_timeout 150s;
        proxy_next_upstream off;
        proxy_pass http://agent-infra-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto "__PLATFORM_PROXY_SCHEME__";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Platform-Proxy-Token "__PLATFORM_PROXY_TOKEN__";
    }

    location /api/ {
        # Save-time model validation can take up to 120 seconds. Never replay writes.
        proxy_read_timeout 150s;
        proxy_next_upstream off;
        proxy_pass http://agent-infra-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $ack_proxy_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Platform-Proxy-Token "__PLATFORM_PROXY_TOKEN__";
    }

    location /auth/ {
        # OIDC callback query parameters contain one-time login credentials.
        access_log /dev/stdout auth_route;
        proxy_pass http://agent-infra-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto "__PLATFORM_PROXY_SCHEME__";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Platform-Proxy-Token "__PLATFORM_PROXY_TOKEN__";
    }

    location / {
        # Startup selects the login control on SPA navigations; hashed assets stay cacheable.
        sub_filter 'data-platform-login-mode="build"' 'data-platform-login-mode="__PLATFORM_WEB_LOGIN_MODE__"';
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}

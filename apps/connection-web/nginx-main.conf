worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $http_x_forwarded_proto $connection_public_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $uri $connection_log_path {
        default $uri;
        ~^/connection/pat-bindings/[^/]+$ /connection/pat-bindings/:flow;
        ~^/oauth/authorization-requests/[^/]+$ /oauth/authorization-requests/:request;
    }
    log_format connection_safe '$remote_addr $request_method $connection_log_path $status $body_bytes_sent';
    access_log /dev/stdout connection_safe;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}

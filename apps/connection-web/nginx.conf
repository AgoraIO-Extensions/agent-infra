server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    sub_filter_types text/plain;
    sub_filter_once off;
    sub_filter '__CONNECTION_ORIGIN__' '$connection_public_scheme://$http_host';

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        return 302 /connection;
    }

    location = /connection {
        return 302 /connection/;
    }

    location = /connection/ {
        try_files /connection/index.html =404;
    }

    location = /connection/index.html {
        try_files $uri =404;
    }

    location = /connection/install.css {
        try_files $uri =404;
    }

    location = /connection/agent {
        return 308 /connection/agent/;
    }

    location ^~ /connection/agent/ {
        try_files $uri $uri/ =404;
    }

    location = /connection/help/user-manual.md {
        try_files $uri =404;
    }

    location = /_connection_company_entry {
        internal;
        proxy_pass http://connection-api:3002/api/v1/connection/identity/oauth/entry/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location @connection_company_login {
        rewrite ^ /api/v1/connection/identity/oauth/entry? break;
        proxy_method GET;
        proxy_pass http://connection-api:3002;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Connection-Return-To $request_uri;
        proxy_set_header X-Connection-Original-Method $request_method;
    }

    location = /oauth/authorize {
        auth_request /_connection_company_entry;
        error_page 401 = @connection_company_login;
        proxy_pass http://connection-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream off;
    }

    location = /connection/help {
        try_files /index.html =404;
    }

    location = /connection/help/ {
        return 308 /connection/help$is_args$args;
    }

    location ^~ /connection/v1/ {
        proxy_pass http://connection-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /connection/internal/v1/action-calls {
        proxy_pass http://connection-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream off;
    }

    location ^~ /connection/pat-bindings/ {
        auth_request /_connection_company_entry;
        error_page 401 = @connection_company_login;
        proxy_pass http://connection-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

	location /connection/ {
		auth_request /_connection_company_entry;
		error_page 401 = @connection_company_login;
		try_files $uri $uri/ /index.html;
	}

	location = /oauth/callback {
		proxy_pass http://connection-api:3002;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
		proxy_next_upstream off;
	}

	location ~ ^/(api/|oauth/|\.well-known/|healthz$|mcp$) {
        proxy_pass http://connection-api:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

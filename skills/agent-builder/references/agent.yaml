schemaVersion: 1
entryServiceName: web
resources:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
            - name: web
              image: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              ports:
                - name: http
                  port: 8080
                  targetPort: 8080
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: worker
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: worker
      template:
        metadata:
          labels:
            app: worker
        spec:
          containers:
            - name: worker
              image: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  - apiVersion: v1
    kind: Service
    metadata:
      name: web
      annotations:
        agent-infra.agora.io/entry: "true"
    spec:
      type: ClusterIP
      selector:
        app: web
      ports:
        - name: http
          port: 8080
          targetPort: 8080
  - apiVersion: v1
    kind: Service
    metadata:
      name: worker
    spec:
      type: ClusterIP
      selector:
        app: worker
      ports:
        - name: http
          port: 8080
          targetPort: 8080

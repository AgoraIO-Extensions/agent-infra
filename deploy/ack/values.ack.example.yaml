# Start from chart/values.yaml and keep this file outside Git: it contains the
# environment-specific image digests, LB origin, WeCom Corp ID and Secret names.
#
# Required overrides (chart defaults are placeholders and deploy.sh rejects a
# rendered manifest that still contains them):
# - images.{web,api,worker,directory,postgres}      immutable repo@sha256 digests
# - images.runtimeHost.{repository,digest}          Worker-created Runtime images
# - publicOrigin                                    actual ACK LB origin
# - agentVersion                                   fixed Skill Agent Version when Skill Hub is enabled
# - skillHub.objectStorage.secretName              namespace-local MinIO credential Secret when enabled
# - directory.corpId                                real WeCom Corp ID
# - ingress.tlsSecret / ingress.className           cluster TLS Secret / class
# - images.pullSecrets                              GHCR pull Secret name(s)
# - secrets.*                                       Secret names in this namespace
# - files.enabled=true and files.configurationFile  when enabling the file data plane;
#   the referenced file must be a key in secrets.apiConfiguration.
# - wecom.enabled=true after configuring the API and Worker WeCom inputs
#   described in docs/architecture/WECOM-text-deployment.md.
#
# The chart expects these existing Secret/ConfigMap objects in the namespace:
# - ack-ghcr-pull
# - agent-infra-platform-database
# - agent-infra-api-configuration
# - agent-infra-api-proxy-token
# - agent-infra-encryption-public-key
# - agent-infra-directory-db
# - agent-infra-directory-migration-db
# - agent-infra-directory-runtime
# - agent-infra-directory-ca
# - agent-infra-worker-configuration
# - agent-infra-worker-runtime-auth
# - agent-infra-worker-keyring
# - agent-infra-worker-directory-read
# - agent-infra-worker-ca
# - agent-infra-directory-source (ConfigMap)
#
# Keep migrations and Postgres disabled when taking over an initialized ACK
# namespace; enable them for a new environment after reviewing storage and DB.
postgres:
  enabled: false
migrations:
  enabled: false

# Enable only after the API/Worker private configuration exports the complete
# Store-backed Skill materializer and the immutable Worker delivery entrypoint.
agentVersion: ""
skillHub:
  enabled: false
  objectStorage:
    enabled: false

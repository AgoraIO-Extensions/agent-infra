{{- $adapter := .Values.externalServiceAdapter | default dict }}
{{- if $adapter.enabled }}
{{- if not $adapter.configSecret }}{{ fail "externalServiceAdapter.configSecret is required when enabled" }}{{ end }}
{{- if not $adapter.publicHost }}{{ fail "externalServiceAdapter.publicHost is required when enabled" }}{{ end }}
{{- if not $adapter.tlsSecret }}{{ fail "externalServiceAdapter.tlsSecret is required when enabled" }}{{ end }}
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-external-service-adapter
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-service-adapter
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: external-service-adapter
  ports: [{name: http, port: {{ $adapter.servicePort }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-external-service-adapter
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-service-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: external-service-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: external-service-adapter
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: adapter
          image: {{ $adapter.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: {{ $adapter.servicePort }} }]
          env:
            - {name: PORT, value: {{ $adapter.servicePort | quote }}}
            - {name: ADAPTER_BIND_ADDRESS, value: "0.0.0.0"}
          readinessProbe:
            httpGet: {path: /.well-known/agent-infra-adapter, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /.well-known/agent-infra-adapter, port: http}
            periodSeconds: 20
          resources: {{ toYaml .Values.resources.externalServiceAdapter | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: adapter-config, mountPath: /etc/agent-infra/adapter, readOnly: true}
      volumes:
        - name: adapter-config
          secret:
            secretName: {{ $adapter.configSecret }}
            items: [{key: config.json, path: config.json}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-infra-external-service-adapter
  labels: {{- include "ack.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: {{ $adapter.ingressClassName }}
  tls: [{hosts: [{{ $adapter.publicHost | quote }}], secretName: {{ $adapter.tlsSecret }}}]
  rules:
    - host: {{ $adapter.publicHost | quote }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: agent-infra-external-service-adapter, port: {number: {{ $adapter.servicePort }}}}}}
{{- end }}

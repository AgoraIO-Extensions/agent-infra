{{- if and .Values.bootstrap.databaseOnly (not .Values.postgres.enabled) }}
{{- fail "bootstrap.databaseOnly requires postgres.enabled" }}
{{- end }}
{{- if .Values.postgres.enabled }}
{{- $admin := default "agent_infra" .Values.postgres.adminUser }}
{{- $database := default "agent_infra" .Values.postgres.initialDatabase }}
{{- $secret := default .Values.secrets.database .Values.postgres.adminSecret }}
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-postgres
  labels:
    app.kubernetes.io/name: agent-infra-postgres
    {{- with .Values.postgres.bootstrapInstallationId }}
    agent-infra.agora.io/bootstrap-id: {{ . | quote }}
    {{- end }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: agent-infra-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-infra-postgres
  labels:
    app.kubernetes.io/name: agent-infra-postgres
    {{- with .Values.postgres.bootstrapInstallationId }}
    agent-infra.agora.io/bootstrap-id: {{ . | quote }}
    {{- end }}
spec:
  serviceName: agent-infra-postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: agent-infra-postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: agent-infra-postgres}}
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      {{- include "ack.scheduling" .Values.scheduling.postgres | nindent 6 }}
      containers:
        - name: postgres
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          image: {{ .Values.images.postgres }}
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: {{ $admin | quote }}}
            - {name: POSTGRES_DB, value: {{ $database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: password}}
          resources: {{ toYaml .Values.resources.postgres | nindent 12 }}
          startupProbe: {exec: {command: [pg_isready, -h, "127.0.0.1", -U, {{ $admin | quote }}, -d, {{ $database | quote }}]}, failureThreshold: 60, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -h, "127.0.0.1", -U, {{ $admin | quote }}, -d, {{ $database | quote }}]}, initialDelaySeconds: 20, periodSeconds: 10}
          readinessProbe: {exec: {command: [pg_isready, -h, "127.0.0.1", -U, {{ $admin | quote }}, -d, {{ $database | quote }}]}, initialDelaySeconds: 5, periodSeconds: 5}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            {{- if .Values.postgres.initializationSecret }}
            - {name: initialization, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            {{- end }}
      {{- if .Values.postgres.initializationSecret }}
      volumes:
        - name: initialization
          secret:
            secretName: {{ .Values.postgres.initializationSecret }}
            items: [{key: 01-roles.sql, path: 01-roles.sql}]
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.postgres.bootstrapInstallationId }}
        labels:
          agent-infra.agora.io/bootstrap-id: {{ . | quote }}
        {{- end }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources: {requests: {storage: {{ .Values.postgres.storageSize }}}}
{{- end }}

{{- /*
API and Worker configuration Secrets owned by the chart. The name
carries a hash of the content and the Secret is immutable, so a content change
creates a new Secret, rolls only the component that mounts it, and Helm removes
the previous one in the same upgrade (helm rollback recreates it).
Values carry base64 data, keyed by file name.
*/ -}}
{{- /* API and Worker mount operations.configurationSecret while operations.enabled, when chart-owned configuration is enabled, require its shared operations file. */}}
{{- if and .Values.operations.enabled .Values.configuration.enabled (not .Values.bootstrap.databaseOnly) (not .Values.configuration.operations) }}
{{- fail "chart-owned operations configuration requires configuration.operations" }}
{{- end }}
{{- if and .Values.configuration.enabled (not .Values.bootstrap.databaseOnly) }}
{{- range $component, $files := dict "api" (include "agentInfra.apiConfigurationFiles" . | fromJson) "worker" (include "agentInfra.workerConfigurationFiles" . | fromJson) }}
{{- if not (hasKey $files "configuration.mjs") }}
{{- fail (printf "configuration.%s must contain configuration.mjs" $component) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- if eq $component "api" }}
  name: {{ include "agentInfra.apiConfigurationSecret" $ }}
  {{- else }}
  name: {{ include "agentInfra.workerConfigurationSecret" $ }}
  {{- end }}
  labels: {{- include "ack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ printf "platform-%s" $component }}
type: Opaque
immutable: true
data:
  {{- range $key, $value := $files }}
  {{- if not (regexMatch "^[-._a-zA-Z0-9]+$" $key) }}
  {{- fail (printf "configuration.%s: invalid file name %q" $component $key) }}
  {{- end }}
  {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- /* Shared operations configuration is independently gated from API/Worker modules. */}}
{{- if and .Values.operations.enabled (not .Values.bootstrap.databaseOnly) }}
{{- with .Values.configuration.operations }}
{{- if not (hasKey . "configuration.json") }}
{{- fail "configuration.operations must contain configuration.json" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "operations.configurationSecret is required" $.Values.operations.configurationSecret }}
  labels: {{- include "ack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: operations
type: Opaque
immutable: true
data:
  {{- range $key, $value := . }}
  {{- if not (regexMatch "^[-._a-zA-Z0-9]+$" $key) }}
  {{- fail (printf "configuration.operations: invalid file name %q" $key) }}
  {{- end }}
  {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
{{- else }}
{{- fail "operations.enabled requires configuration.operations.configuration.json" }}
{{- end }}
{{- end }}
{{- end }}

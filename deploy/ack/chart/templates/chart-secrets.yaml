{{- /*
Overlay: chart-owned bootstrap Secrets (database URLs, keys, tokens, TLS, pull
secret). Values carry base64 data so binary content and exact bytes (no
trailing newline) survive. Rendered in databaseOnly mode too, because the
Postgres StatefulSet and the migration hooks read them.
*/ -}}
{{- if .Values.chartSecrets.enabled }}
{{- range $name, $item := .Values.chartSecrets.items }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $name) }}
{{- fail (printf "chartSecrets.items: invalid Secret name %q" $name) }}
{{- end }}
{{- if not $item.data }}
{{- fail (printf "chartSecrets.items.%s.data is empty" $name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ack.labels" $ | nindent 4 }}
  {{- if ne (toString $item.keep) "false" }}
  annotations:
    # Uninstalling or removing the item never deletes key material.
    helm.sh/resource-policy: keep
  {{- end }}
type: {{ $item.type | default "Opaque" }}
data:
  {{- range $key, $value := $item.data }}
  {{- if not (regexMatch "^[-._a-zA-Z0-9]+$" $key) }}
  {{- fail (printf "chartSecrets.items.%s.data: invalid key %q" $name $key) }}
  {{- end }}
  {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}

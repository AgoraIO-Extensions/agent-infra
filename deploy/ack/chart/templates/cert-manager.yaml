{{- $certManager := .Values.certManager | default dict }}
{{- if and $certManager.enabled (not .Values.bootstrap.databaseOnly) }}
{{- $issuer := $certManager.issuer }}
{{- $certificate := $certManager.certificate }}
{{- $createIssuer := true }}
{{- if hasKey $issuer "create" }}{{- $createIssuer = $issuer.create }}{{- end }}
{{- $dnsName := required "certManager.certificate.dnsNames is required when certManager.enabled=true" (index $certificate.dnsNames 0) }}
{{- $issuerName := required "certManager.issuer.name is required when certManager.enabled=true" $issuer.name }}
{{- $certificateName := required "certManager.certificate.name is required when certManager.enabled=true" $certificate.name }}
{{- $secretName := required "certManager.certificate.secretName is required when certManager.enabled=true" $certificate.secretName }}
{{- $acmeServer := required "certManager.issuer.acmeServer is required when certManager.enabled=true" $issuer.acmeServer }}
{{- $ingressClassName := required "certManager.issuer.ingressClassName is required when certManager.enabled=true" $issuer.ingressClassName }}
{{- if not (regexMatch "^https://[^[:space:]]+$" $acmeServer) }}{{ fail "certManager.issuer.acmeServer must be an HTTPS URL" }}{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $issuerName) }}{{ fail "certManager.issuer.name is not a valid Kubernetes name" }}{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $certificateName) }}{{ fail "certManager.certificate.name is not a valid Kubernetes name" }}{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $secretName) }}{{ fail "certManager.certificate.secretName is not a valid Kubernetes name" }}{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $ingressClassName) }}{{ fail "certManager.issuer.ingressClassName is not a valid Kubernetes name" }}{{- end }}
{{- if hasPrefix "*." $dnsName }}{{ fail "certManager.certificate.dnsNames must not contain wildcard names" }}{{- end }}
{{- if and $createIssuer (not $issuer.accountSecretName) }}{{ fail "certManager.issuer.accountSecretName is required when creating an Issuer" }}{{- end }}
{{- if not $issuer.acmeAuthorizationRef }}{{ fail "certManager.issuer.acmeAuthorizationRef is required when certManager.enabled=true" }}{{- end }}
{{- if $createIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $issuerName }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ack.labels" . | nindent 4 }}
  annotations:
    agent-infra.agora.io/acme-authorization-ref: {{ required "certManager.issuer.acmeAuthorizationRef is required when certManager.enabled=true" $issuer.acmeAuthorizationRef | quote }}
    agent-infra.agora.io/renewal-owner: {{ required "certManager.renewalOwner is required when certManager.enabled=true" $certManager.renewalOwner | quote }}
spec:
  acme:
    server: {{ $acmeServer | quote }}
    # The account Secret is an existing owner-supplied object; cert-manager must not generate a key.
    disableAccountKeyGeneration: true
    privateKeySecretRef:
      name: {{ $issuer.accountSecretName }}
    solvers:
      - selector:
          dnsNames: [{{ $dnsName | quote }}]
        http01:
          ingress:
            ingressClassName: {{ $ingressClassName | quote }}
            serviceType: ClusterIP
            {{- with $issuer.nodeSelector }}
            podTemplate:
              spec:
                nodeSelector:
{{ toYaml . | nindent 18 }}
            {{- end }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certificateName }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ack.labels" . | nindent 4 }}
  annotations:
    agent-infra.agora.io/acme-authorization-ref: {{ $issuer.acmeAuthorizationRef | quote }}
    agent-infra.agora.io/renewal-owner: {{ $certManager.renewalOwner | quote }}
spec:
  secretName: {{ $secretName }}
  dnsNames: [{{ $dnsName | quote }}]
  issuerRef:
    name: {{ $issuerName }}
    kind: Issuer
    group: cert-manager.io
{{- end }}

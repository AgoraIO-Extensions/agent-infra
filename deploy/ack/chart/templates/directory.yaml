{{- if not .Values.bootstrap.databaseOnly }}
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-directory
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: enterprise-directory-sync
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: enterprise-directory-sync
  ports: [{name: https, port: 3004, targetPort: https}]
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-directory-sync
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: enterprise-directory-sync
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: enterprise-directory-sync
  ports: [{name: https, port: 3004, targetPort: https}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-directory
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: enterprise-directory-sync
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: enterprise-directory-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: enterprise-directory-sync
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- include "ack.scheduling" .Values.scheduling.directory | nindent 6 }}
      containers:
        - name: directory
          image: {{ .Values.images.directory }}
          imagePullPolicy: IfNotPresent
          command: [node, --experimental-strip-types, dist/index.mjs]
          ports: [{name: https, containerPort: 3004}]
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, initialDelaySeconds: 20, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {{ toYaml .Values.resources.directory | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: DIRECTORY_ROOT_DEPARTMENT_ID, value: "1"}
            - {name: WECOM_CORP_ID, value: {{ .Values.directory.corpId | quote }}}
            - {name: DIRECTORY_SOURCE_MODULE, value: {{ .Values.directory.sourceModule | quote }}}
            - {name: DIRECTORY_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.directoryDatabase }}, key: url}}}
            - {name: DIRECTORY_READ_TOKEN_FILE, value: /run/secrets/read-token}
            - {name: WECOM_CORP_SECRET_FILE, value: /run/secrets/corp-secret}
            - {name: DIRECTORY_TLS_CERT_FILE, value: /run/secrets/tls.crt}
            - {name: DIRECTORY_TLS_KEY_FILE, value: /run/secrets/tls.key}
            - {name: DIRECTORY_SOURCE_SERVICE_KEY_FILE, value: /run/secrets/agora_service_key}
          volumeMounts:
            - {name: source, mountPath: /app/directory-source, readOnly: true}
            - {name: runtime, mountPath: /run/secrets, readOnly: true}
      volumes:
        - {name: source, configMap: {name: {{ .Values.directory.sourceConfigMap }}}}
        - {name: runtime, secret: {secretName: {{ .Values.secrets.directoryRuntime }}}}

{{- end }}

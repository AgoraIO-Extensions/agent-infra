{{- if not .Values.bootstrap.databaseOnly }}
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-api
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: platform-api
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-api
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  replicas: {{ .Values.replicas.api | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: platform-api
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "ack.securityContext" . | nindent 8 }}
      {{- include "ack.scheduling" .Values.scheduling.api | nindent 6 }}
      {{- $skillHub := .Values.skillHub | default dict }}
      {{- $platformApi := .Values.platformApi | default dict }}
      {{- $callbackAuth := $platformApi.connectionCallbackAuthSecretRef }}
      {{- if or $skillHub.enabled $callbackAuth }}
      initContainers:
        {{- if $callbackAuth }}
        # Secret projections are root-owned; the forwarder requires UID 1000/0600.
        - name: connection-callback-auth
          image: {{ .Values.images.api | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              cp "$1" "$2"
              chmod 0600 "$2"
            - callback-auth
            - /callback-source/callback.auth
            - /var/run/agent-infra/connection-callback-auth/callback.auth
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - {name: connection-callback-auth-source, mountPath: /callback-source, readOnly: true}
            - {name: connection-callback-auth, mountPath: /var/run/agent-infra/connection-callback-auth}
        {{- end }}
        {{- if $skillHub.enabled }}
        - name: skill-scanner-runtime
          image: {{ ($skillHub.scannerImage | default .Values.images.api) | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              mkdir -p /scanner/bin /scanner/lib /scanner/usr-lib /scanner/db
              cp -L /usr/bin/clamscan /scanner/bin/clamscan
              cp -R /lib/. /scanner/lib/
              cp -R /usr/lib/. /scanner/usr-lib/
              for file in /var/lib/clamav/*.cvd /var/lib/clamav/*.cld; do
                [ -f "$file" ] || continue
                cp "$file" /scanner/db/
              done
              cat > /scanner/bin/clamscan-wrapper <<'EOF'
              #!/bin/sh
              set -eu
              export LD_LIBRARY_PATH=/opt/agent-infra/skill-scanner/lib:/opt/agent-infra/skill-scanner/usr-lib
              exec /opt/agent-infra/skill-scanner/bin/clamscan "$@"
              EOF
              chmod 0755 /scanner/bin/clamscan-wrapper
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - {name: skill-scanner, mountPath: /scanner}
        {{- end }}
      {{- end }}
      containers:
        - name: platform-api
          image: {{ .Values.images.api }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: PLATFORM_API_DEPLOYMENT_MODULE, value: file:///app/dist/deployment.mjs}
            - {name: PLATFORM_API_CONFIGURATION_MODULE, value: file:///app/deployment/configuration.mjs}
            - {name: PLATFORM_API_PROXY_TOKEN_FILE, value: /var/run/agent-infra/proxy-token/token}
            - {name: PLATFORM_PUBLIC_ORIGIN, value: {{ .Values.publicOrigin | quote }}}
            {{- with .Values.agentVersion }}
            - {name: AGENT_INFRA_AGENT_VERSION, value: {{ . | quote }}}
            {{- end }}
            - name: PLATFORM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.database }}, key: url}}
            - {name: AGENT_INFRA_ENCRYPTION_PUBLIC_KEY_FILE, value: /var/run/agent-infra/encryption-public-key/public.pem}
            - {name: AGENT_INFRA_ENCRYPTION_KEY_VERSION, value: {{ .Values.encryption.keyVersion | quote }} }
            - {name: NODE_EXTRA_CA_CERTS, value: /var/run/agent-infra/directory-ca/tls.crt}
            {{- if $callbackAuth }}
            - {name: PLATFORM_API_CONNECTION_CALLBACK_AUTH_FILE, value: /var/run/agent-infra/connection-callback-auth/callback.auth}
            {{- end }}
            {{- if .Values.files.enabled }}
            - {name: PLATFORM_API_FILE_DEPLOYMENT_CONFIGURATION_FILE, value: {{ .Values.files.configurationFile | quote }} }
            {{- end }}
          volumeMounts:
            - {name: api-configuration, mountPath: /app/deployment, readOnly: true}
            - {name: proxy-token, mountPath: /var/run/agent-infra/proxy-token, readOnly: true}
            - {name: encryption-public-key, mountPath: /var/run/agent-infra/encryption-public-key, readOnly: true}
            - {name: directory-ca, mountPath: /var/run/agent-infra/directory-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $callbackAuth }}
            - {name: connection-callback-auth, mountPath: /var/run/agent-infra/connection-callback-auth, readOnly: true}
            {{- end }}
            {{- if $skillHub.enabled }}
            - {name: skill-scanner, mountPath: /opt/agent-infra/skill-scanner, readOnly: true}
            {{- end }}
      volumes:
        - {name: api-configuration, secret: {secretName: {{ .Values.secrets.apiConfiguration }}}}
        - name: proxy-token
          secret: {secretName: {{ .Values.secrets.apiProxyToken }}, items: [{key: token, path: token}]}
        - name: encryption-public-key
          secret: {secretName: {{ .Values.secrets.encryptionPublicKey }}, items: [{key: public.pem, path: public.pem}]}
        - name: directory-ca
          secret: {secretName: {{ .Values.secrets.directoryCa }}, items: [{key: tls.crt, path: tls.crt}]}
        - {name: tmp, emptyDir: {}}
        {{- if $callbackAuth }}
        - name: connection-callback-auth-source
          secret:
            secretName: {{ $callbackAuth.name }}
            defaultMode: 288
            items: [{key: {{ $callbackAuth.key | quote }}, path: callback.auth}]
        - {name: connection-callback-auth, emptyDir: {medium: Memory, sizeLimit: 16Ki}}
        {{- end }}
        {{- if $skillHub.enabled }}
        - {name: skill-scanner, emptyDir: {}}
        {{- end }}

{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: agent-infra-api
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: platform-api
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-api
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: platform-api
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "ack.securityContext" . | nindent 8 }}
      {{- include "ack.scheduling" .Values.scheduling.api | nindent 6 }}
      containers:
        - name: platform-api
          image: {{ .Values.images.api }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: PLATFORM_API_DEPLOYMENT_MODULE, value: file:///app/dist/deployment.mjs}
            - {name: PLATFORM_API_CONFIGURATION_MODULE, value: file:///app/deployment/configuration.mjs}
            - {name: PLATFORM_API_PROXY_TOKEN_FILE, value: /var/run/agent-infra/proxy-token/token}
            - {name: PLATFORM_PUBLIC_ORIGIN, value: {{ .Values.publicOrigin | quote }}}
            - name: PLATFORM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.database }}, key: url}}
            - {name: AGENT_INFRA_ENCRYPTION_PUBLIC_KEY_FILE, value: /var/run/agent-infra/encryption-public-key/public.pem}
            - {name: AGENT_INFRA_ENCRYPTION_KEY_VERSION, value: {{ .Values.encryption.keyVersion | quote }} }
            - {name: NODE_EXTRA_CA_CERTS, value: /var/run/agent-infra/directory-ca/tls.crt}
          volumeMounts:
            - {name: api-configuration, mountPath: /app/deployment, readOnly: true}
            - {name: proxy-token, mountPath: /var/run/agent-infra/proxy-token, readOnly: true}
            - {name: encryption-public-key, mountPath: /var/run/agent-infra/encryption-public-key, readOnly: true}
            - {name: directory-ca, mountPath: /var/run/agent-infra/directory-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: api-configuration, secret: {secretName: {{ .Values.secrets.apiConfiguration }}}}
        - name: proxy-token
          secret: {secretName: {{ .Values.secrets.apiProxyToken }}, items: [{key: token, path: token}]}
        - name: encryption-public-key
          secret: {secretName: {{ .Values.secrets.encryptionPublicKey }}, items: [{key: public.pem, path: public.pem}]}
        - name: directory-ca
          secret: {secretName: {{ .Values.secrets.directoryCa }}, items: [{key: tls.crt, path: tls.crt}]}
        - {name: tmp, emptyDir: {}}

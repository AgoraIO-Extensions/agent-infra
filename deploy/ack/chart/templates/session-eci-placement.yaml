{{- if and .Values.sessionRuntimeScheduling.protectedRuntime.enabled (not .Values.sessionRuntimeScheduling.enabled) }}
{{- fail "sessionRuntimeScheduling.protectedRuntime requires sessionRuntimeScheduling.enabled=true" }}
{{- end }}
{{- if not .Values.bootstrap.databaseOnly }}
{{- if .Values.sessionRuntimeScheduling.enabled }}
{{- if not (semverCompare ">=1.36.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail "sessionRuntimeScheduling requires Kubernetes 1.36 or later (GA MutatingAdmissionPolicy)" }}
{{- end }}
{{- $runtimeClassName := .Values.sessionRuntimeScheduling.runtimeClassName | default "" }}
{{- if and .Values.sessionRuntimeScheduling.imageCache.required (ne $runtimeClassName "") }}
{{- fail "sessionRuntimeScheduling.imageCache is only supported with ECI placement; disable it for a RuntimeClass" }}
{{- end }}
{{- if and .Values.sessionRuntimeScheduling.protectedRuntime.enabled (ne $runtimeClassName "") }}
{{- fail "sessionRuntimeScheduling.protectedRuntime requires ECI placement; disable it for a RuntimeClass" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ printf "%s-session-eci" .Release.Namespace }}
  labels: {{- include "ack.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
    objectSelector:
      matchLabels:
        agent-infra.agora.io/managed: session-sandbox-v1
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [
            {{- if eq .Values.sessionRuntimeScheduling.compute "acs" }}
            JSONPatch{op:"add",path:"/metadata/labels",value:has(object.metadata.labels)?object.metadata.labels:{}},
            JSONPatch{op:"add",path:"/metadata/labels/alibabacloud.com~1acs",value:"true"},
            JSONPatch{op:"add",path:"/metadata/labels/alibabacloud.com~1compute-class",value:"general-purpose"},
            JSONPatch{op:"add",path:"/metadata/labels/alibabacloud.com~1compute-qos",value:"default"},
            JSONPatch{op:"add",path:"/metadata/annotations",value:has(object.metadata.annotations)?object.metadata.annotations:{}},
            JSONPatch{op:"add",path:"/metadata/annotations/network.alibabacloud.com~1enable-network-policy-agent",value:"true"},
            {{- end }}
            {{- if ne $runtimeClassName "" }}
            JSONPatch{op:"add",path:"/spec/runtimeClassName",value:{{ $runtimeClassName | quote }}},
            {{- end }}
            JSONPatch{op:"add",path:"/spec/nodeSelector",value:has(object.spec.nodeSelector)?object.spec.nodeSelector:{}},
            {{- if eq $runtimeClassName "" }}
            JSONPatch{op:"add",path:"/spec/nodeSelector/type",value:"virtual-kubelet"},
            {{- end }}
            JSONPatch{op:"add",path:"/spec/nodeSelector/kubernetes.io~1arch",value:{{ .Values.sessionRuntimeScheduling.architecture | quote }}}
            {{- if and (eq $runtimeClassName "") .Values.sessionRuntimeScheduling.protectedRuntime.enabled }},
            JSONPatch{op:"add",path:"/metadata/annotations",value:has(object.metadata.annotations)?object.metadata.annotations:{}},
            JSONPatch{op:"add",path:"/metadata/annotations/k8s.aliyun.com~1eci-host-sysctls",value:"kernel.yama.ptrace_scope={{ .Values.sessionRuntimeScheduling.protectedRuntime.yamaPtraceScope }}"}
            {{- end }}
          ] + (
            {{- if ne $runtimeClassName "" }}
            []
            {{- else }}
            !has(object.spec.tolerations) ?
            [JSONPatch{op:"add",path:"/spec/tolerations",value:[{"key":"virtual-kubelet.io/provider","operator":"Equal","value":"alibabacloud","effect":"NoSchedule"}]}] :
            object.spec.tolerations.exists(t,
              has(t.key) && t.key=="virtual-kubelet.io/provider" &&
              (!has(t.operator) || t.operator=="Equal") &&
              has(t.value) && t.value=="alibabacloud" &&
              has(t.effect) && t.effect=="NoSchedule") ? [] :
            [JSONPatch{op:"add",path:"/spec/tolerations/-",value:{"key":"virtual-kubelet.io/provider","operator":"Equal","value":"alibabacloud","effect":"NoSchedule"}}]
            {{- end }}
          )
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-session-eci" .Release.Namespace }}
  labels: {{- include "ack.labels" . | nindent 4 }}
spec:
  policyName: {{ printf "%s-session-eci" .Release.Namespace }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
    objectSelector:
      matchLabels:
        agent-infra.agora.io/managed: session-sandbox-v1
{{- end }}

{{- end }}

{{- if not .Values.bootstrap.databaseOnly }}
{{- if and (ne .Values.sigCorePilot "off") (or (eq .Values.agentWorkloadScheduling.compute "acs") (eq .Values.sessionRuntimeScheduling.compute "acs")) }}
{{- fail "ACS does not support sigCorePilot; keep sigCorePilot=off" }}
{{- end }}
{{- $skillHub := .Values.skillHub | default dict }}
{{- $hostnameCertificates := .Values.worker.hostnameCertificates | default dict }}
{{- $nativeMetadata := .Values.worker.nativeMetadataGateway | default dict }}
{{- $nativeMetadataApiOrigin := $nativeMetadata.platformApiOrigin | default (printf "http://agent-infra-api.%s.svc:3000" .Release.Namespace) }}
{{- $manualInstall := .Values.connectionManualInstallation | default dict }}
{{- $manualInstallEnabled := eq ($manualInstall.enabled | default false) true }}
{{- if and $skillHub.enabled (not .Values.agentVersion) }}
{{- fail "skillHub.enabled requires the fixed agentVersion" }}
{{- end }}
{{- /* Overlay seams ported from agent-infra-ack (see source.lock.json). */}}
{{- $fileBridge := .Values.worker.fileBridge | default dict }}
{{- if and $fileBridge.enabled (not (.Values.files | default dict).enabled) }}
{{- fail "worker.fileBridge.enabled requires files.enabled" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-infra-worker
  labels: {{- include "ack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-infra-worker
rules:
  {{- if ne .Values.sigCorePilot "off" }}
  {{- if or (ne .Release.Namespace "ack-community-m1-4405") (not .Values.agentWorkloadScheduling.enabled) }}
  {{- fail "sigCorePilot requires ack-community-m1-4405 and deployment-owned ECI placement" }}
  {{- end }}
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, create, delete]
  {{- end }}
  - apiGroups: [""]
    resources: [pods, configmaps, persistentvolumeclaims, secrets, serviceaccounts, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [create, delete, get, list, patch, update, watch]
  {{- if $hostnameCertificates.enabled }}
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-infra-worker
subjects: [{kind: ServiceAccount, name: agent-infra-worker}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-infra-worker}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-worker
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  replicas: 1
  # A single Worker must not overlap itself while claiming queued work.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-worker
  template:
    metadata:
      {{- with include "agentInfra.podAnnotations" (dict "root" . "names" (list .Values.secrets.database .Values.secrets.workerRuntimeAuth .Values.secrets.workerKeyring .Values.secrets.workerDirectoryRead .Values.secrets.workerCa)) }}{{ . | nindent 6 }}{{- end }}
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: platform-worker
        {{- if $nativeMetadata.enabled }}
        # The Worker opens each Session's egress to its gateway by component and instance labels.
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
    spec:
      serviceAccountName: agent-infra-worker
      {{- include "ack.pullSecrets" . | nindent 6 }}
      {{- include "ack.scheduling" .Values.scheduling.worker | nindent 6 }}
      securityContext:
        {{- if $skillHub.enabled }}
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
        {{- else }}
        {{- include "ack.securityContext" . | nindent 8 }}
        {{- end }}
      {{- if $skillHub.enabled }}
      initContainers:
        - name: skill-assembly-permissions
          image: {{ .Values.images.worker }}
          command: [node, -e, "const fs=require('node:fs'); fs.chownSync('/skill-assembly',0,1000); fs.chmodSync('/skill-assembly',0o700); fs.chownSync('/skill-assembly',1001,1000)"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN]}
          resources: {{ toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts: [{name: skill-assembly, mountPath: /skill-assembly}]
      {{- end }}
      containers:
        - name: platform-worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          {{- if $nativeMetadata.enabled }}
          ports: [{name: native-metadata, containerPort: {{ $nativeMetadata.port }}, protocol: TCP}]
          {{- end }}
          resources: {{ toYaml .Values.resources.worker | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          {{- with .Values.worker.readinessProbe }}
          # Overlay: only valid when the configuration enables the 3004 gateway.
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- with .Values.sigCoreSdkTrialImage }}
            {{- if or (ne $.Values.sigCorePilot "new") (ne $.Release.Namespace "ack-community-m1-4405") (not $.Values.sessionRuntimeScheduling.enabled) }}
            {{- fail "sigCoreSdkTrialImage requires the new 4405 pilot and Session ECI placement" }}
            {{- end }}
            - {name: AGENT_INFRA_SIG_CORE_SDK_TRIAL_IMAGE, value: {{ . | quote }}}
            {{- end }}
            - {name: PLATFORM_WORKER_CERTIFICATE_RECONCILIATION_WRITES, value: {{ .Values.worker.certificateReconciliationWrites | default false | quote }}}
            {{- if hasKey (default dict .Values.oidc) "administratorUserIds" }}
            - name: PLATFORM_OIDC_ADMINISTRATOR_USER_IDS
              value: {{ .Values.oidc.administratorUserIds | toJson | quote }}
            {{- end }}
            - {name: PLATFORM_WORKER_DEPLOYMENT_MODULE, value: file:///app/dist/deployment.mjs}
            - name: PLATFORM_WORKER_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: PLATFORM_WORKER_WECOM_ENABLED, value: {{ .Values.wecom.enabled | quote }}}
            {{- $executorDrain := .Values.worker.executorDrain | default dict }}
            {{- if $executorDrain.enabled }}
            - {name: PLATFORM_WORKER_EXECUTOR_DRAIN_STARTUP_TIMEOUT_MS, value: {{ $executorDrain.startupTimeoutMs | int | quote }}}
            {{- end }}
            {{- if .Values.worker.retainedPvcIdentityWrites }}
            - {name: PLATFORM_WORKER_RETAINED_PVC_IDENTITY_WRITES, value: "true"}
            {{- end }}
            {{- if $fileBridge.enabled }}
            # This release's API Service origin and its one egress destination (the API Pods behind it,
            # port 3000). The Worker validates both before writing any Kubernetes resource.
            - {name: PLATFORM_WORKER_FILE_EXCHANGE_ORIGIN, value: {{ printf "http://agent-infra-api.%s.svc:3000" .Release.Namespace | quote }}}
            - name: PLATFORM_WORKER_FILE_EXCHANGE_EGRESS
              value: {{ dict "namespace" .Release.Namespace "podLabels" (dict "app.kubernetes.io/name" "agent-infra" "app.kubernetes.io/component" "platform-api") | toJson | quote }}
            {{- end }}
            - {name: PLATFORM_WORKER_SERVICE_TOKEN_FILE, value: /var/run/agent-infra/runtime-auth/service-token}
            - name: PLATFORM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.database }}, key: url}}
            - {name: AGENT_INFRA_WORKER_KEYRING_FILE, value: /var/run/agent-infra/keyring/keyring.pem}
            - {name: AGENT_INFRA_WORKER_KEY_VERSIONS, value: {{ .Values.worker.keyVersions | quote }} }
            - {name: AGENT_INFRA_RUNTIME_IMAGE_REPOSITORY, value: {{ .Values.images.runtimeHost.repository | quote }}}
            - {name: AGENT_INFRA_RUNTIME_IMAGE_DIGEST, value: {{ .Values.images.runtimeHost.digest | quote }}}
            {{- with .Values.agentVersion }}
            - {name: AGENT_INFRA_AGENT_VERSION, value: {{ . | quote }}}
            {{- end }}
            {{- if and .Values.worker.piSessionPlacement .Values.sessionRuntimeScheduling.enabled (not .Values.sessionRuntimeScheduling.runtimeClassName) }}
            - name: AGENT_INFRA_PI_SESSION_ECI_PLACEMENT
              value: {{ dict "architecture" .Values.sessionRuntimeScheduling.architecture "legacyUnplaced" "reject" | toJson | quote }}
            {{- end }}
            {{- if .Values.agentWorkloadScheduling.enabled }}
            {{- $placement := dict "architecture" .Values.agentWorkloadScheduling.architecture "legacyUnplaced" .Values.agentWorkloadScheduling.legacyUnplaced }}
            {{- if eq .Values.agentWorkloadScheduling.compute "acs" }}
            {{- $_ := set $placement "compute" "acs" }}
            {{- end }}
            - name: AGENT_INFRA_AGENT_WORKLOAD_PLACEMENT
              value: {{ $placement | toJson | quote }}
            {{- end }}
            {{- if and .Values.sessionRuntimeScheduling.enabled (eq .Values.sessionRuntimeScheduling.compute "acs") }}
            - name: AGENT_INFRA_SESSION_RUNTIME_PLACEMENT
              value: {{ dict "architecture" .Values.sessionRuntimeScheduling.architecture "compute" "acs" | toJson | quote }}
            {{- end }}
            - {name: NODE_EXTRA_CA_CERTS, value: /var/run/agent-infra/directory-ca/ca.crt}
            {{- with include "agentInfra.connectionManualInstallationEnv" (dict "root" . "worker" true) }}{{ . | nindent 12 }}{{- end }}
            {{- if $skillHub.enabled }}
            - {name: PLATFORM_WORKER_SKILL_MATERIALIZATION_REQUIRED, value: "true"}
            - {name: PLATFORM_WORKER_SKILL_INIT_IMAGE, value: {{ .Values.images.worker | quote }}}
            - {name: PLATFORM_WORKER_SKILL_ASSEMBLY_ROOT, value: /var/lib/agent-infra/skill-assembly}
            {{- end }}
            {{- if .Values.operations.enabled }}
            - {name: AGENT_INFRA_OPERATIONS_CONFIG_FILE, value: /var/run/agent-infra/operations/configuration.json}
            - name: AGENT_INFRA_OPERATIONS_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            {{- end }}
            {{- if $nativeMetadata.enabled }}
            - {name: PLATFORM_WORKER_NATIVE_METADATA_GATEWAY_ENABLED, value: "true"}
            - {name: PLATFORM_WORKER_NATIVE_METADATA_GATEWAY_PORT, value: {{ $nativeMetadata.port | quote }}}
            - {name: PLATFORM_WORKER_NATIVE_METADATA_GATEWAY_ORIGIN, value: {{ printf "http://%s" (include "agentInfra.nativeMetadataServiceName" .) | quote }}}
            - {name: PLATFORM_WORKER_RELEASE_NAME, value: {{ .Release.Name | quote }}}
            - {name: PLATFORM_WORKER_NATIVE_METADATA_PLATFORM_API_ORIGIN, value: {{ $nativeMetadataApiOrigin | quote }}}
            - {name: PLATFORM_WORKER_NATIVE_METADATA_API_REPLICA_ROUTING, value: "true"}
            {{- end }}
          volumeMounts:
            {{- if .Values.operations.enabled }}
            - {name: operations-configuration, mountPath: /var/run/agent-infra/operations, readOnly: true}
            {{- end }}
            - {name: worker-configuration, mountPath: /app/dist/configuration.mjs, subPath: configuration.mjs, readOnly: true}
            {{- if gt (len (.Values.worker.executorInstanceStartupApprovals | default list)) 0 }}
            # Keep the original module beside its original image-relative dependencies.
            - {name: worker-configuration, mountPath: /app/dist/executor-base-configuration.mjs, subPath: executor-base-configuration.mjs, readOnly: true}
            {{- end }}
            - {name: worker-configuration, mountPath: /var/run/agent-infra/deployment, readOnly: true}
            - {name: runtime-auth, mountPath: /var/run/agent-infra/runtime-auth, readOnly: true}
            - {name: keyring, mountPath: /var/run/agent-infra/keyring, readOnly: true}
            - {name: directory-read, mountPath: /var/run/agent-infra/directory, readOnly: true}
            - {name: directory-ca, mountPath: /var/run/agent-infra/directory-ca, readOnly: true}
            {{- if $manualInstallEnabled }}
            # #4199 C2: Worker-only install transport files (paths in the configuration module).
            - {name: connection-install-host-ca, mountPath: /var/run/agent-infra/connection-install/host-ca, readOnly: true}
            - {name: connection-install-readback-tls, mountPath: /var/run/agent-infra/connection-install/readback-tls, readOnly: true}
            - {name: connection-install-keyring, mountPath: /var/run/agent-infra/connection-install/keyring, readOnly: true}
            {{- end }}
            {{- if $skillHub.enabled }}
            - {name: worker-configuration, mountPath: /app/deployment, readOnly: true}
            - {name: skill-assembly, mountPath: /var/lib/agent-infra/skill-assembly}
            {{- end }}
      volumes:
        {{- if .Values.operations.enabled }}
        {{- include "agentInfra.operationsConfigurationVolume" . | nindent 8 }}
        {{- end }}
        {{- if $skillHub.enabled }}
        - {name: skill-assembly, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
        {{- end }}
        - {name: worker-configuration, secret: {secretName: {{ include "agentInfra.workerConfigurationSecret" . }}, defaultMode: 288}}
        - name: runtime-auth
          secret: {secretName: {{ .Values.secrets.workerRuntimeAuth }}, items: [{key: runtime-grant.pem, path: runtime-grant.pem}, {key: service-token, path: service-token}]}
        - name: keyring
          secret: {secretName: {{ .Values.secrets.workerKeyring }}, items: [{key: keyring.pem, path: keyring.pem}]}
        - name: directory-read
          secret: {secretName: {{ .Values.secrets.workerDirectoryRead }}, items: [{key: read-token, path: read-token}]}
        - name: directory-ca
          secret: {secretName: {{ .Values.secrets.workerCa }}, items: [{key: ca.crt, path: ca.crt}]}
        {{- if $manualInstallEnabled }}
        {{- $keyring := $manualInstall.keyringSecretRef | default dict }}
        - name: connection-install-host-ca
          secret:
            secretName: {{ $manualInstall.hostCaSecretRef.name | quote }}
            defaultMode: 288
            items: [{key: {{ $manualInstall.hostCaSecretRef.key | quote }}, path: ca.crt}]
        - name: connection-install-readback-tls
          secret:
            secretName: {{ $manualInstall.readbackTlsSecretRef.name | quote }}
            defaultMode: 288
            items:
              - {key: {{ $manualInstall.readbackTlsSecretRef.certKey | quote }}, path: tls.crt}
              - {key: {{ $manualInstall.readbackTlsSecretRef.keyKey | quote }}, path: tls.key}
        - name: connection-install-keyring
          secret:
            secretName: {{ $keyring.name | default .Values.secrets.workerKeyring | quote }}
            defaultMode: 288
            items: [{key: {{ $keyring.key | default "keyring.pem" | quote }}, path: keyring.pem}]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-worker-internal
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: platform-worker
  ports: [{name: http, protocol: TCP, port: 3004, targetPort: 3004}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-infra-worker-internal
  labels: {{- include "ack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-infra
              app.kubernetes.io/component: platform-api
      ports: [{protocol: TCP, port: 3004}]
    # Host current-confirmation callbacks share this authenticated listener.
    - from:
        - podSelector:
            matchLabels:
              agent-infra.agora.io/managed: session-sandbox-v1
            matchExpressions:
              - {key: agent-infra.agora.io/sandbox-id, operator: Exists}
              - {key: agent-infra.agora.io/agent-ref, operator: Exists}
              - {key: agent-infra.agora.io/session-ref, operator: Exists}
              - {key: agent-infra.agora.io/generation, operator: Exists}
      ports: [{protocol: TCP, port: 3004}]
    {{- if and .Values.worker.nativeMetadataGateway.enabled .Values.worker.nativeMetadataGateway.agentCallbacks }}
    - from:
        - podSelector:
            matchExpressions:
              - {key: agent-infra.agora.io/agent, operator: Exists}
              - {key: agent-infra.agora.io/revision, operator: Exists}
              - {key: statefulset.kubernetes.io/pod-name, operator: Exists}
      ports: [{protocol: TCP, port: 3004 }]
    {{- end }}
{{- if $manualInstallEnabled }}
---
# #4199 C2: Worker EP-1060 readback (Spec §13.5.6), at agentInfra.connectionInstallWorkerOrigin.
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-worker-connection-install
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: platform-worker
  ports: [{name: readback, protocol: TCP, port: {{ int $manualInstall.readbackPort }}, targetPort: {{ int $manualInstall.readbackPort }}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-infra-worker-connection-install
  labels: {{- include "ack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-worker
  policyTypes: [Ingress]
  ingress:
    # Only Session Sandbox Hosts read back their install; the API and other Pods never call it.
    - from:
        - podSelector:
            matchLabels:
              agent-infra.agora.io/managed: session-sandbox-v1
            matchExpressions:
              - {key: agent-infra.agora.io/sandbox-id, operator: Exists}
              - {key: agent-infra.agora.io/agent-ref, operator: Exists}
              - {key: agent-infra.agora.io/session-ref, operator: Exists}
              - {key: agent-infra.agora.io/generation, operator: Exists}
      ports: [{protocol: TCP, port: {{ int $manualInstall.readbackPort }}}]
{{- end }}
{{- end }}
{{- if .Values.worker.nativeMetadataGateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentInfra.nativeMetadataServiceName" . }}
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: platform-worker
  ports: [{name: native-metadata, port: 80, targetPort: native-metadata, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentInfra.nativeMetadataServiceName" . }}
  labels: {{- include "ack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agent-infra, app.kubernetes.io/component: platform-worker}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agent-infra, app.kubernetes.io/component: platform-api}
      ports: [{protocol: TCP, port: {{ .Values.worker.nativeMetadataGateway.port }} }]
    - from:
        - podSelector:
            matchLabels:
              agent-infra.agora.io/managed: session-sandbox-v1
            matchExpressions:
              - {key: agent-infra.agora.io/sandbox-id, operator: Exists}
              - {key: agent-infra.agora.io/agent-ref, operator: Exists}
              - {key: agent-infra.agora.io/session-ref, operator: Exists}
              - {key: agent-infra.agora.io/generation, operator: Exists}
      ports: [{protocol: TCP, port: {{ .Values.worker.nativeMetadataGateway.port }} }]

{{- end }}

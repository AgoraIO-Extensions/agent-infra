apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-infra-worker
  labels: {{- include "ack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-infra-worker
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, persistentvolumeclaims, secrets, serviceaccounts, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-infra-worker
subjects: [{kind: ServiceAccount, name: agent-infra-worker}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-infra-worker}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-worker
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: platform-worker
    spec:
      serviceAccountName: agent-infra-worker
      {{- include "ack.pullSecrets" . | nindent 6 }}
      {{- include "ack.scheduling" .Values.scheduling.worker | nindent 6 }}
      securityContext:
        {{- include "ack.securityContext" . | nindent 8 }}
      containers:
        - name: platform-worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          resources: {{ toYaml .Values.resources.worker | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: PLATFORM_WORKER_DEPLOYMENT_MODULE, value: file:///app/dist/deployment.mjs}
            - name: PLATFORM_WORKER_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: PLATFORM_WORKER_WECOM_ENABLED, value: "false"}
            - {name: PLATFORM_WORKER_SERVICE_TOKEN_FILE, value: /var/run/agent-infra/runtime-auth/service-token}
            - name: PLATFORM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.database }}, key: url}}
            - {name: AGENT_INFRA_WORKER_KEYRING_FILE, value: /var/run/agent-infra/keyring/keyring.pem}
            - {name: AGENT_INFRA_WORKER_KEY_VERSIONS, value: {{ .Values.worker.keyVersions | quote }} }
            - {name: AGENT_INFRA_RUNTIME_IMAGE_REPOSITORY, value: {{ .Values.images.runtimeHost.repository | quote }}}
            - {name: AGENT_INFRA_RUNTIME_IMAGE_DIGEST, value: {{ .Values.images.runtimeHost.digest | quote }}}
            - {name: NODE_EXTRA_CA_CERTS, value: /var/run/agent-infra/directory-ca/ca.crt}
          volumeMounts:
            - {name: worker-configuration, mountPath: /app/dist/configuration.mjs, subPath: configuration.mjs, readOnly: true}
            - {name: worker-configuration, mountPath: /var/run/agent-infra/deployment, readOnly: true}
            - {name: runtime-auth, mountPath: /var/run/agent-infra/runtime-auth, readOnly: true}
            - {name: keyring, mountPath: /var/run/agent-infra/keyring, readOnly: true}
            - {name: directory-read, mountPath: /var/run/agent-infra/directory, readOnly: true}
            - {name: directory-ca, mountPath: /var/run/agent-infra/directory-ca, readOnly: true}
      volumes:
        - {name: worker-configuration, secret: {secretName: {{ .Values.secrets.workerConfiguration }}}}
        - name: runtime-auth
          secret: {secretName: {{ .Values.secrets.workerRuntimeAuth }}, items: [{key: runtime-grant.pem, path: runtime-grant.pem}, {key: service-token, path: service-token}]}
        - name: keyring
          secret: {secretName: {{ .Values.secrets.workerKeyring }}, items: [{key: keyring.pem, path: keyring.pem}]}
        - name: directory-read
          secret: {secretName: {{ .Values.secrets.workerDirectoryRead }}, items: [{key: read-token, path: read-token}]}
        - name: directory-ca
          secret: {secretName: {{ .Values.secrets.workerCa }}, items: [{key: ca.crt, path: ca.crt}]}

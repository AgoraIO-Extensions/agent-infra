{{- if not .Values.bootstrap.databaseOnly }}
{{- $skillHub := .Values.skillHub | default dict }}
{{- if and $skillHub.enabled (not .Values.agentVersion) }}
{{- fail "skillHub.enabled requires the fixed agentVersion" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-infra-worker
  labels: {{- include "ack.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-infra-worker
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, persistentvolumeclaims, secrets, serviceaccounts, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-infra-worker
subjects: [{kind: ServiceAccount, name: agent-infra-worker}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-infra-worker}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-worker
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  replicas: 1
  # A single Worker must not overlap itself while claiming queued work.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: platform-worker
    spec:
      serviceAccountName: agent-infra-worker
      {{- include "ack.pullSecrets" . | nindent 6 }}
      {{- include "ack.scheduling" .Values.scheduling.worker | nindent 6 }}
      securityContext:
        {{- if $skillHub.enabled }}
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
        {{- else }}
        {{- include "ack.securityContext" . | nindent 8 }}
        {{- end }}
      {{- if $skillHub.enabled }}
      initContainers:
        - name: skill-assembly-permissions
          image: {{ .Values.images.worker }}
          command: [node, -e, "const fs=require('node:fs'); fs.chownSync('/skill-assembly',0,1000); fs.chmodSync('/skill-assembly',0o700); fs.chownSync('/skill-assembly',1001,1000)"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN]}
          resources: {{ toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts: [{name: skill-assembly, mountPath: /skill-assembly}]
      {{- end }}
      containers:
        - name: platform-worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          resources: {{ toYaml .Values.resources.worker | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: PLATFORM_WORKER_DEPLOYMENT_MODULE, value: file:///app/dist/deployment.mjs}
            - name: PLATFORM_WORKER_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: PLATFORM_WORKER_WECOM_ENABLED, value: {{ .Values.wecom.enabled | quote }}}
            - {name: PLATFORM_WORKER_SERVICE_TOKEN_FILE, value: /var/run/agent-infra/runtime-auth/service-token}
            - name: PLATFORM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.database }}, key: url}}
            - {name: AGENT_INFRA_WORKER_KEYRING_FILE, value: /var/run/agent-infra/keyring/keyring.pem}
            - {name: AGENT_INFRA_WORKER_KEY_VERSIONS, value: {{ .Values.worker.keyVersions | quote }} }
            - {name: AGENT_INFRA_RUNTIME_IMAGE_REPOSITORY, value: {{ .Values.images.runtimeHost.repository | quote }}}
            - {name: AGENT_INFRA_RUNTIME_IMAGE_DIGEST, value: {{ .Values.images.runtimeHost.digest | quote }}}
            {{- with .Values.agentVersion }}
            - {name: AGENT_INFRA_AGENT_VERSION, value: {{ . | quote }}}
            {{- end }}
            - {name: NODE_EXTRA_CA_CERTS, value: /var/run/agent-infra/directory-ca/ca.crt}
            {{- if $skillHub.enabled }}
            - {name: PLATFORM_WORKER_SKILL_MATERIALIZATION_REQUIRED, value: "true"}
            - {name: PLATFORM_WORKER_SKILL_INIT_IMAGE, value: {{ .Values.images.worker | quote }}}
            - {name: PLATFORM_WORKER_SKILL_ASSEMBLY_ROOT, value: /var/lib/agent-infra/skill-assembly}
            {{- end }}
          volumeMounts:
            - {name: worker-configuration, mountPath: /app/dist/configuration.mjs, subPath: configuration.mjs, readOnly: true}
            - {name: worker-configuration, mountPath: /var/run/agent-infra/deployment, readOnly: true}
            - {name: runtime-auth, mountPath: /var/run/agent-infra/runtime-auth, readOnly: true}
            - {name: keyring, mountPath: /var/run/agent-infra/keyring, readOnly: true}
            - {name: directory-read, mountPath: /var/run/agent-infra/directory, readOnly: true}
            - {name: directory-ca, mountPath: /var/run/agent-infra/directory-ca, readOnly: true}
            {{- if $skillHub.enabled }}
            - {name: skill-assembly, mountPath: /var/lib/agent-infra/skill-assembly}
            {{- end }}
      volumes:
        {{- if $skillHub.enabled }}
        - {name: skill-assembly, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
        {{- end }}
        - {name: worker-configuration, secret: {secretName: {{ .Values.secrets.workerConfiguration }}}}
        - name: runtime-auth
          secret: {secretName: {{ .Values.secrets.workerRuntimeAuth }}, items: [{key: runtime-grant.pem, path: runtime-grant.pem}, {key: service-token, path: service-token}]}
        - name: keyring
          secret: {secretName: {{ .Values.secrets.workerKeyring }}, items: [{key: keyring.pem, path: keyring.pem}]}
        - name: directory-read
          secret: {secretName: {{ .Values.secrets.workerDirectoryRead }}, items: [{key: read-token, path: read-token}]}
        - name: directory-ca
          secret: {secretName: {{ .Values.secrets.workerCa }}, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-worker-internal
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: platform-worker
  ports: [{name: http, protocol: TCP, port: 3004, targetPort: 3004}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-infra-worker-internal
  labels: {{- include "ack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: platform-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-infra
              app.kubernetes.io/component: platform-api
      ports: [{protocol: TCP, port: 3004}]
    # Host current-confirmation callbacks share this authenticated listener.
    - from:
        - podSelector:
            matchLabels:
              agent-infra.agora.io/managed: session-sandbox-v1
            matchExpressions:
              - {key: agent-infra.agora.io/sandbox-id, operator: Exists}
              - {key: agent-infra.agora.io/agent-ref, operator: Exists}
              - {key: agent-infra.agora.io/session-ref, operator: Exists}
              - {key: agent-infra.agora.io/generation, operator: Exists}
      ports: [{protocol: TCP, port: 3004}]
{{- end }}

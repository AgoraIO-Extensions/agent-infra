{{- if not .Values.bootstrap.databaseOnly }}
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-web
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: web
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-web
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      {{- include "ack.scheduling" .Values.scheduling.web | nindent 6 }}
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - name: PLATFORM_PROXY_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.apiProxyToken }}, key: token}}
            - {name: PLATFORM_PROXY_TOKEN_REQUIRED, value: "true"}
            - {name: PLATFORM_PROXY_SCHEME, value: https}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-infra-web
  labels: {{- include "ack.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{secretName: {{ .Values.ingress.tlsSecret }}}]
  {{- if .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: agent-infra-web, port: {number: 8080}}}}
  {{- else }}
  rules:
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: agent-infra-web, port: {number: 8080}}}}
  {{- end }}
{{- end }}

{{- end }}

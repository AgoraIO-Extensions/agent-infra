{{- if not .Values.bootstrap.databaseOnly }}
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-web
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: web
  ports: [{name: http, port: 8080, targetPort: http}{{ if .Values.publicationAdminIngress }}, {name: publication, port: 8081, targetPort: 8081}{{ end }}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-web
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: web
  template:
    metadata:
      {{- with include "agentInfra.podAnnotations" (dict "root" . "names" (list .Values.secrets.apiProxyToken)) }}{{ . | nindent 6 }}{{- end }}
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      {{- include "ack.scheduling" .Values.scheduling.web | nindent 6 }}
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          {{- with (.Values.web | default dict).preStopSleepSeconds }}
          # Overlay: the single Web replica fronts /api too; keep serving while the Ingress drops its endpoint.
          lifecycle: {preStop: {sleep: {seconds: {{ . }}}}}
          {{- end }}
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            {{- with .Values.platformWeb }}
            - name: PLATFORM_WEB_LOGIN_MODE
              value: {{ .loginMode | quote }}
            {{- end }}
            - name: PLATFORM_PROXY_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.apiProxyToken }}, key: token}}
            - {name: PLATFORM_PROXY_TOKEN_REQUIRED, value: "true"}
            - {name: PLATFORM_PROXY_SCHEME, value: https}
          {{- if .Values.publicationAdminIngress }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-config, mountPath: /tmp/nginx-conf}
            - {name: publication-admin, mountPath: /tmp/nginx-conf/admin.conf, subPath: admin.conf, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: nginx-config, emptyDir: {}}
        - name: publication-admin
          configMap: {name: agent-infra-publication-admin-{{ include "agentInfra.publicationAdminConfig" . | sha256sum | trunc 12 }}}
          {{- else }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
          {{- end }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-infra-web
  labels: {{- include "ack.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.host }}
  # hosts lets cert-manager's ingress-shim issue the certificate for this host.
  tls: [{secretName: {{ .Values.ingress.tlsSecret }}, hosts: [{{ .Values.ingress.host | quote }}]}]
  {{- else }}
  tls: [{secretName: {{ .Values.ingress.tlsSecret }}}]
  {{- end }}
  {{- if .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: agent-infra-web, port: {number: 8080}}}}
  {{- else }}
  rules:
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: agent-infra-web, port: {number: 8080}}}}
  {{- end }}
{{- end }}

{{- end }}

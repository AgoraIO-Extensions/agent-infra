{{- $skillHub := .Values.skillHub | default dict -}}
{{- $objectStorage := $skillHub.objectStorage | default dict -}}
{{- if $objectStorage.enabled }}
{{- if not $skillHub.enabled }}
{{- fail "skillHub.objectStorage.enabled requires skillHub.enabled" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: agent-infra-minio
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: skill-object-storage
spec:
  selector:
    app.kubernetes.io/name: agent-infra
    app.kubernetes.io/component: skill-object-storage
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-infra-minio
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: skill-object-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $objectStorage.storageClass | quote }}
  resources:
    requests:
      storage: {{ $objectStorage.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-infra-minio
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: skill-object-storage
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-infra
      app.kubernetes.io/component: skill-object-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: skill-object-storage
    spec:
      automountServiceAccountToken: false
      {{- include "ack.pullSecrets" . | nindent 6 }}
      {{- include "ack.scheduling" .Values.scheduling.skillObjectStorage | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: {{ $objectStorage.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/minio"]
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ $objectStorage.secretName }}, key: {{ $objectStorage.accessKeyKey }}}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $objectStorage.secretName }}, key: {{ $objectStorage.secretKeyKey }}}}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{ toYaml (.Values.resources.skillObjectStorage | default .Values.resources.api) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: false
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: agent-infra-minio}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-infra-minio-bucket
  labels: {{- include "ack.labels" . | nindent 4 }}
    app.kubernetes.io/component: skill-object-storage
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-infra
        app.kubernetes.io/component: skill-object-storage-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      {{- include "ack.pullSecrets" . | nindent 6 }}
      {{- include "ack.scheduling" .Values.scheduling.skillObjectStorage | nindent 6 }}
      securityContext:
        {{- include "ack.securityContext" . | nindent 8 }}
      containers:
        - name: bucket
          image: {{ .Values.images.api | quote }}
          command: ["node", "--input-type=module", "-e"]
          args:
            - |
              import { S3Client, HeadBucketCommand, CreateBucketCommand, PutBucketVersioningCommand } from "@aws-sdk/client-s3";
              const client = new S3Client({endpoint:"http://agent-infra-minio:9000",region:"us-east-1",forcePathStyle:true,credentials:{accessKeyId:process.env.MINIO_ROOT_USER,secretAccessKey:process.env.MINIO_ROOT_PASSWORD},maxAttempts:1});
              const bucket = process.env.MINIO_BUCKET;
              for (let attempt = 0; attempt < 60; attempt++) {
                try {
                  await client.send(new HeadBucketCommand({Bucket: bucket}));
                  break;
                } catch (error) {
                  const status = error?.$metadata?.httpStatusCode;
                  const notFound = status === 404 || error?.name === "NotFound";
                  const retryable = notFound || status === undefined || status >= 500;
                  if (!retryable || attempt === 59) throw error;
                  if (notFound) {
                    try { await client.send(new CreateBucketCommand({Bucket: bucket})); } catch (createError) {
                      if (createError?.$metadata?.httpStatusCode !== 409 && createError?.name !== "BucketAlreadyOwnedByYou") throw createError;
                    }
                    break;
                  }
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                }
              }
              await client.send(new PutBucketVersioningCommand({Bucket: bucket,VersioningConfiguration:{Status:"Enabled"}}));
          env:
            - name: MINIO_BUCKET
              value: {{ $objectStorage.bucket | quote }}
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ $objectStorage.secretName }}, key: {{ $objectStorage.accessKeyKey }}}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $objectStorage.secretName }}, key: {{ $objectStorage.secretKeyKey }}}}
          resources: {{ toYaml (.Values.resources.skillObjectStorage | default .Values.resources.api) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
{{- end }}

                  number: 8080
          - path: /llms.txt
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/install.css
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connection-web
  namespace: agent-connector
  labels:
    connection.agora.io/hci-stage: activate
  annotations:
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "308"
    konghq.com/strip-path: "false"
    konghq.com/plugins: connection-hci-auth
spec:
  ingressClassName: kong
  rules:
    - host: agent-connector.agoralab.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: connection-web
                port:
                  number: 8080

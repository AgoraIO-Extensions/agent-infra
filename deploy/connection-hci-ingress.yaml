      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/index.html
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/agent
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/agent/
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/agent/index.html
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/agent/llms.txt
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/help
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/help/
            pathType: Exact
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /connection/help/user-manual.md
            pathType: Exact
            backend:
              service:
                name: connection-web

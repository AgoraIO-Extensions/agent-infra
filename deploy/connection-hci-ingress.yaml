metadata:
  name: connection-public
  namespace: agent-connector
  labels:
    connection.agora.io/hci-stage: prepare
  annotations:
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "308"
    konghq.com/strip-path: "false"
    konghq.com/regex-priority: "100"
spec:
  ingressClassName: kong
  rules:
    - host: agent-connector.agoralab.co
      http:
        paths:
          - path: /~/(?<=^/)healthz$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/index\.html$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/agent$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/agent/$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/agent/index\.html$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/agent/llms\.txt$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/help$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/help/$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/help/user-manual\.md$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)llms\.txt$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)connection/install\.css$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
          - path: /~/(?<=^/)assets(?:/.*)?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: connection-web
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: connection-web
  namespace: agent-connector
  labels:
    connection.agora.io/hci-stage: activate
  annotations:
    konghq.com/protocols: https
    konghq.com/https-redirect-status-code: "308"
    konghq.com/strip-path: "false"
    konghq.com/plugins: connection-hci-auth
spec:
  ingressClassName: kong
  rules:
    - host: agent-connector.agoralab.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: connection-web
                port:
                  number: 8080

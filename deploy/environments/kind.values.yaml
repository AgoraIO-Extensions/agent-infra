images:
  platformWorker:
    repository: node
    digest: sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
  runtimeHost:
    repository: node
    digest: sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03

web:
  placement: external
  externalBaseUrl: https://web.kind.example.invalid

platformApi:
  placement: external
  externalBaseUrl: https://api.kind.example.invalid

adapters:
  workloadRoute: deployment-adapter

migration:
  enabled: false

workloadTopology:
  enabled: true
  route:
    enabled: true
    host: agent.kind.example.invalid
    tlsSecretName: agent-infra-kind-topology-tls

# The topology fixture has no in-cluster API/Runtime process. Production
# Worker deployments inherit the chart default (enabled).
platformWorker:
  nativeMetadataGateway:
    enabled: false
  # 设置保守的 requests 使本地 Worker Pod 从 BestEffort 升级为 Burstable（oom_score_adj 降低），
  # 避免 VM 内存紧张时 OOM Killer 优先杀掉 Worker。
  # 不设 limits 是有意为之：limits 会触发容器自身的 cgroup OOM，本地环境没有严格的资源配额需求；
  # 只要有 requests，Kubernetes 就会将 Pod QoS 从 BestEffort 变为 Burstable。
  resources:
    requests:
      memory: "1Gi"
      cpu: "100m"

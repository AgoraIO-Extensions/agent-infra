{{- $callbackAuthRef := .Values.platformApi.connectionCallbackAuthSecretRef | default dict -}}
{{- $moduleRef := .Values.platformApi.configurationModuleSecretRef | default dict -}}
{{- $proxyTokenRef := .Values.platformApi.proxyTokenSecretRef | default dict -}}
{{- $caRef := .Values.platformApi.trustedCaSecretRef | default dict -}}
{{- $workerAuthRef := .Values.platformWorker.runtimeAuthSecretRef | default dict -}}
{{- $nativeMetadataServiceName := include "agent-infra.nativeMetadataServiceName" . -}}
{{- if and (ne .Values.platformApi.placement "in-cluster") $callbackAuthRef.name -}}
{{- fail "platformApi.connectionCallbackAuthSecretRef requires platformApi.placement=in-cluster" -}}
{{- end -}}
{{- if and (ne .Values.platformApi.placement "in-cluster") (or $moduleRef.name $proxyTokenRef.name $caRef.name) -}}
{{- fail "platformApi private configuration Secret references require platformApi.placement=in-cluster" -}}
{{- end -}}
{{- if and (eq .Values.platformApi.placement "in-cluster") (or (eq .Values.platformApi.deploymentModule "file:///app/dist/deployment.mjs") (eq .Values.platformApi.deploymentModule "/app/dist/deployment.mjs")) -}}
{{- if not $moduleRef.name -}}
{{- fail "platformApi.configurationModuleSecretRef is required for the first-party API deployment module" -}}
{{- end -}}
{{- if not $proxyTokenRef.name -}}
{{- fail "platformApi.proxyTokenSecretRef is required for the first-party API deployment module" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.platformWorker.nativeMetadataGateway.enabled (eq .Values.platformApi.placement "in-cluster") (not .Values.workloadTopology.enabled) -}}
{{- if not $workerAuthRef.name -}}
{{- fail "platformWorker.runtimeAuthSecretRef.name is required for native metadata" -}}
{{- end -}}
{{- if not $workerAuthRef.serviceTokenKey -}}
{{- fail "platformWorker.runtimeAuthSecretRef.serviceTokenKey is required for native metadata" -}}
{{- end -}}
{{- end -}}
{{- if eq .Values.platformApi.placement "in-cluster" -}}
{{- $name := include "agent-infra.componentName" (dict "root" . "suffix" "platform-api") -}}
{{- $bindings := include "agent-infra.componentName" (dict "root" . "suffix" "adapter-bindings") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-api
spec:
  replicas: 1
  # Request-local current confirmation must reach the only live API instance.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: platform-api
      annotations:
        agent-infra.agora.io/connection-profile-version: {{ include "agent-infra.connectionProfileVersion" . | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: {{ include "agent-infra.image" .Values.images.platformApi }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: PLATFORM_API_DEPLOYMENT_MODULE
              value: {{ .Values.platformApi.deploymentModule | quote }}
            {{- if $moduleRef.name }}
            - name: PLATFORM_API_CONFIGURATION_MODULE
              value: {{ printf "file:///app/deployment/%s" $moduleRef.key | quote }}
            {{- end }}
            {{- if $proxyTokenRef.name }}
            - name: PLATFORM_API_PROXY_TOKEN_FILE
              value: /var/run/agent-infra/proxy-token/token
            {{- end }}
            {{- if $caRef.name }}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/agent-infra/trusted-ca/ca.crt
            {{- end }}
            - name: PLATFORM_PUBLIC_ORIGIN
              value: {{ .Values.web.externalBaseUrl | quote }}
            - name: PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretRef.name }}
                  key: {{ .Values.database.secretRef.key }}
            - name: AGENT_INFRA_ENCRYPTION_PUBLIC_KEY_FILE
              value: /var/run/agent-infra/encryption-public-key/public.pem
            - name: AGENT_INFRA_ENCRYPTION_KEY_VERSION
              value: {{ .Values.keys.encryptionPublicKey.version | quote }}
            {{- if $callbackAuthRef.name }}
            - name: PLATFORM_API_CONNECTION_CALLBACK_AUTH_FILE
              value: /var/run/agent-infra/connection-callback-auth/callback.auth
            {{- end }}
            {{- if and .Values.platformWorker.nativeMetadataGateway.enabled (not .Values.workloadTopology.enabled) }}
            - name: PLATFORM_API_NATIVE_METADATA_WORKER_ORIGIN
              value: http://{{ $nativeMetadataServiceName }}
            - name: PLATFORM_API_NATIVE_METADATA_WORKER_SERVICE_TOKEN_FILE
              value: /var/run/agent-infra/native-metadata-worker/service-token
            {{- end }}
            {{- include "agent-infra.connectionEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $bindings }}
            {{- include "agent-infra.connectionEnvFrom" . | nindent 12 }}
          volumeMounts:
            {{- if $moduleRef.name }}
            - name: api-configuration
              mountPath: /app/deployment
              readOnly: true
            {{- end }}
            {{- if $proxyTokenRef.name }}
            - name: api-proxy-token
              mountPath: /var/run/agent-infra/proxy-token
              readOnly: true
            {{- end }}
            {{- if $caRef.name }}
            - name: api-trusted-ca
              mountPath: /var/run/agent-infra/trusted-ca
              readOnly: true
            {{- end }}
            - name: encryption-public-key
              mountPath: /var/run/agent-infra/encryption-public-key
              readOnly: true
            {{- if $callbackAuthRef.name }}
            - name: connection-callback-auth
              mountPath: /var/run/agent-infra/connection-callback-auth/callback.auth
              subPath: callback.auth
              readOnly: true
            {{- end }}
            {{- if and .Values.platformWorker.nativeMetadataGateway.enabled (not .Values.workloadTopology.enabled) }}
            - name: native-metadata-worker-token
              mountPath: /var/run/agent-infra/native-metadata-worker/service-token
              subPath: service-token
              readOnly: true
            {{- end }}
      volumes:
        {{- if $moduleRef.name }}
        - name: api-configuration
          secret:
            secretName: {{ $moduleRef.name }}
            defaultMode: 288
        {{- end }}
        {{- if $proxyTokenRef.name }}
        - name: api-proxy-token
          secret:
            secretName: {{ $proxyTokenRef.name }}
            defaultMode: 288
            items:
              - key: {{ $proxyTokenRef.key }}
                path: token
        {{- end }}
        {{- if $caRef.name }}
        - name: api-trusted-ca
          secret:
            secretName: {{ $caRef.name }}
            defaultMode: 288
            items:
              - key: {{ $caRef.key }}
                path: ca.crt
        {{- end }}
        - name: encryption-public-key
          secret:
            secretName: {{ .Values.keys.encryptionPublicKey.secretRef.name }}
            items:
              - key: {{ .Values.keys.encryptionPublicKey.secretRef.key }}
                path: public.pem
        {{- if $callbackAuthRef.name }}
        - name: connection-callback-auth
          secret:
            secretName: {{ required "platformApi.connectionCallbackAuthSecretRef.name is required" $callbackAuthRef.name }}
            defaultMode: 384
            items:
              - key: {{ required "platformApi.connectionCallbackAuthSecretRef.key is required" $callbackAuthRef.key }}
                path: callback.auth
        {{- end }}
        {{- if and .Values.platformWorker.nativeMetadataGateway.enabled (not .Values.workloadTopology.enabled) }}
        - name: native-metadata-worker-token
          secret:
            secretName: {{ $workerAuthRef.name }}
            defaultMode: 288
            items:
              - key: {{ $workerAuthRef.serviceTokenKey }}
                path: service-token
        {{- end }}
{{- end }}

{{- include "agent-infra.validate" . -}}
{{- if eq .Values.connectionConsumer.source "inline" -}}
{{- $profile := .Values.connectionConsumer.inline -}}
{{- $fingerprint := include "agent-infra.connectionFingerprint" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-infra.connectionProfileName" . }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
  annotations:
    agent-infra.agora.io/config-version: {{ printf "%v-%s" $profile.schemaVersion $fingerprint | quote }}
    agent-infra.agora.io/config-fingerprint: {{ $fingerprint | quote }}
    agent-infra.agora.io/config-source-ref: {{ $profile.approval.source.ref | quote }}
    agent-infra.agora.io/config-source-revision: {{ $profile.approval.source.revision | quote }}
data:
  AGENT_INFRA_CONNECTION_PROFILE_SCHEMA_VERSION: {{ $profile.schemaVersion | quote }}
  AGENT_INFRA_CONNECTION_PROFILE: {{ toJson (dict "schemaVersion" $profile.schemaVersion "publicOrigin" $profile.publicOrigin "mcpPath" $profile.mcpPath "consumerId" $profile.consumerId "audience" $profile.audience "egressProfile" $profile.egressProfile) | quote }}
  AGENT_INFRA_CONNECTION_CONFIG_VERSION: {{ printf "%v-%s" $profile.schemaVersion $fingerprint | quote }}
  AGENT_INFRA_CONNECTION_CONFIG_FINGERPRINT: {{ $fingerprint | quote }}
  AGENT_INFRA_CONNECTION_EGRESS_PROFILE_REF: {{ $profile.egressProfile.ref | quote }}
  AGENT_INFRA_CONNECTION_EGRESS_PROFILE_REVISION: {{ $profile.egressProfile.revision | quote }}
  AGENT_INFRA_CONNECTION_APPROVAL_SOURCE_REF: {{ $profile.approval.source.ref | quote }}
  AGENT_INFRA_CONNECTION_APPROVAL_SOURCE_REVISION: {{ $profile.approval.source.revision | quote }}
{{- end }}

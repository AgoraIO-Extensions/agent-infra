{{- if .Values.workloadTopology.enabled -}}
{{- if and .Values.workloadTopology.legacyMigrationTrust.enabled (ne .Values.workloadTopology.legacyMigrationTrust.mountDir "/etc/agent-infra/legacy-migration") -}}
{{- fail "legacyMigrationTrust.mountDir must be /etc/agent-infra/legacy-migration" -}}
{{- end -}}
{{- $name := include "agent-infra.componentName" (dict "root" . "suffix" "workload") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-workload
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-workload
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent-workload
  ports:
    - name: runtime-host
      port: {{ .Values.workloadTopology.service.runtimePort }}
      targetPort: runtime-host
    - name: route
      port: {{ .Values.workloadTopology.service.routePort }}
      targetPort: route
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-workload
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent-workload
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime-host-topology
          image: {{ include "agent-infra.image" .Values.images.runtimeHost }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- if .Values.workloadTopology.legacyMigrationTrust.enabled }}
          {{- if ne (int .Values.workloadTopology.legacyMigrationTrust.trustRootUid) 0 }}
          {{- fail "workloadTopology.legacyMigrationTrust.trustRootUid must be 0" }}
          {{- end }}
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.workloadTopology.service.runtimePort | quote }}
            - name: AGENT_INFRA_RUNTIME_TOPOLOGY_ROUTE_PORT
              value: {{ .Values.workloadTopology.service.routePort | quote }}
            {{- if .Values.workloadTopology.legacyMigrationTrust.enabled }}
            - name: AGENT_INFRA_RUNTIME_LEGACY_MIGRATION_FILE
              value: {{ printf "%s/manifest.json" .Values.workloadTopology.legacyMigrationTrust.mountDir | quote }}
            - name: AGENT_INFRA_RUNTIME_LEGACY_MIGRATION_PUBLIC_KEY_FILE
              value: {{ printf "%s/migration-public.pem" .Values.workloadTopology.legacyMigrationTrust.mountDir | quote }}
            - name: AGENT_INFRA_RUNTIME_LEGACY_MIGRATION_KEY_ID
              value: {{ required "workloadTopology.legacyMigrationTrust.keyId is required" .Values.workloadTopology.legacyMigrationTrust.keyId | quote }}
            - name: AGENT_INFRA_RUNTIME_LEGACY_MIGRATION_TRUST_ROOT_UID
              value: "0"
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -eu;
              if [ -n "${NODE_OPTIONS+x}${NODE_DEBUG+x}${NODE_DEBUG_NATIVE+x}${NODE_V8_COVERAGE+x}${NODE_PATH+x}${LD_PRELOAD+x}${LD_AUDIT+x}${LD_LIBRARY_PATH+x}${DYLD_INSERT_LIBRARIES+x}${DYLD_LIBRARY_PATH+x}${DYLD_FRAMEWORK_PATH+x}" ] || env | grep -Eq '^(LD_|DYLD_)'; then
                printf '%s\n' '{"service":"agent-runtime-host","code":"RUNTIME_PROCESS_PROTECTION_INVALID"}' >&2;
                exit 1;
              fi;
              ulimit -S -c 0 || exit 1;
              ulimit -H -c 0 || exit 1;
              exec node --disable-sigusr1 -e 'const http=require("node:http"); const ports=[process.env.PORT,process.env.AGENT_INFRA_RUNTIME_TOPOLOGY_ROUTE_PORT].map(Number); if (ports.some((port)=>!Number.isInteger(port)||port<1||port>65535)) process.exit(1); for (const port of new Set(ports)) http.createServer((_,res)=>res.end("ok")).listen(port);'
          ports:
            - name: runtime-host
              containerPort: {{ .Values.workloadTopology.service.runtimePort }}
            - name: route
              containerPort: {{ .Values.workloadTopology.service.routePort }}
          readinessProbe:
            httpGet:
              path: /
              port: runtime-host
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime-data
              mountPath: /var/lib/agent-runtime
            {{- if .Values.workloadTopology.legacyMigrationTrust.enabled }}
            - name: legacy-migration-manifest
              mountPath: {{ printf "%s/manifest.json" .Values.workloadTopology.legacyMigrationTrust.mountDir | quote }}
              subPath: manifest.json
              readOnly: true
            - name: legacy-migration-public-key
              mountPath: {{ printf "%s/migration-public.pem" .Values.workloadTopology.legacyMigrationTrust.mountDir | quote }}
              subPath: migration-public.pem
              readOnly: true
            {{- end }}
      {{- if .Values.workloadTopology.legacyMigrationTrust.enabled }}
      volumes:
        - name: legacy-migration-manifest
          secret:
            secretName: {{ required "workloadTopology.legacyMigrationTrust.manifestSecretName is required" .Values.workloadTopology.legacyMigrationTrust.manifestSecretName | quote }}
            defaultMode: 0444
            items:
              - key: {{ .Values.workloadTopology.legacyMigrationTrust.manifestSecretKey | quote }}
                path: manifest.json
        - name: legacy-migration-public-key
          secret:
            secretName: {{ required "workloadTopology.legacyMigrationTrust.publicKeySecretName is required" .Values.workloadTopology.legacyMigrationTrust.publicKeySecretName | quote }}
            defaultMode: 0444
            items:
              - key: {{ .Values.workloadTopology.legacyMigrationTrust.publicKeySecretKey | quote }}
                path: migration-public.pem
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: runtime-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.workloadTopology.storageSize }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-workload
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent-workload
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: platform-worker
      ports:
        - protocol: TCP
          port: {{ .Values.workloadTopology.service.runtimePort }}
    {{- if and .Values.workloadTopology.route.enabled (eq .Values.adapters.workloadRoute "ingress") }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.workloadTopology.route.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.workloadTopology.service.routePort }}
    {{- end }}
    {{- if and .Values.workloadTopology.route.enabled (eq .Values.adapters.workloadRoute "deployment-adapter") }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: workload-route
      ports:
        - protocol: TCP
          port: {{ .Values.workloadTopology.service.routePort }}
    {{- end }}
  egress: []
{{- if and .Values.workloadTopology.route.enabled (eq .Values.adapters.workloadRoute "ingress") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-workload
spec:
  ingressClassName: {{ .Values.workloadTopology.route.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.workloadTopology.route.host }}
      secretName: {{ .Values.workloadTopology.route.tlsSecretName }}
  rules:
    - host: {{ .Values.workloadTopology.route.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: route
{{- end }}
{{- if and .Values.workloadTopology.route.enabled (eq .Values.adapters.workloadRoute "deployment-adapter") }}
{{- $routeName := include "agent-infra.componentName" (dict "root" . "suffix" "route") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $routeName }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-route
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: workload-route
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $routeName }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload-route
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: workload-route
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: workload-route
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: route
          image: {{ include "agent-infra.image" .Values.images.runtimeHost }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["node", "-e"]
          args:
            - >-
              const fs=require('node:fs'),http=require('node:http'),https=require('node:https');
              https.createServer({key:fs.readFileSync('/tls/tls.key'),cert:fs.readFileSync('/tls/tls.crt')},(req,res)=>{
              const upstream=http.request({hostname:'{{ $name }}',port:{{ .Values.workloadTopology.service.routePort }},path:req.url,method:req.method,headers:req.headers},response=>{
              res.writeHead(response.statusCode??502,response.headers);response.pipe(res)});
              upstream.on('error',()=>{res.writeHead(502);res.end()});req.pipe(upstream)}).listen(8443);
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: https
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.workloadTopology.route.tlsSecretName }}
{{- end }}
{{- end }}

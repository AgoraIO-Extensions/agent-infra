{{- if and .Values.workloadTopology.enabled .Values.platformWorker.wecomEnabled -}}
{{- fail "platformWorker.wecomEnabled requires production Worker deployment (workloadTopology.enabled=false)" -}}
{{- end -}}
{{- if and .Values.platformWorker.nativeMetadataGateway.enabled (ne .Values.platformApi.placement "in-cluster") -}}
{{- fail "platformWorker.nativeMetadataGateway.enabled requires platformApi.placement=in-cluster" -}}
{{- end -}}
{{- $name := include "agent-infra.componentName" (dict "root" . "suffix" "platform-worker") -}}
{{- $bindings := include "agent-infra.componentName" (dict "root" . "suffix" "adapter-bindings") -}}
{{- $moduleRef := .Values.platformWorker.configurationModuleSecretRef | default dict -}}
{{- $authRef := .Values.platformWorker.runtimeAuthSecretRef | default dict -}}
{{- $caRef := .Values.platformWorker.trustedCaSecretRef | default dict -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # Session Sandbox Pods are created, replaced and deleted directly by the Worker adapter.
    verbs: ["create", "delete", "get", "list", "update", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "secrets", "serviceaccounts", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    # 多服务 Agent 的 Deployment 与 StatefulSet 由 Worker 直接创建、更新和回滚。
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    # 多服务发布前的迁移 Job；Worker 每次发布都会先读取它。
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  replicas: {{ .Values.platformWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: platform-worker
      annotations:
        agent-infra.agora.io/connection-profile-version: {{ include "agent-infra.connectionProfileVersion" . | quote }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-worker
          image: {{ include "agent-infra.image" .Values.images.platformWorker }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- if .Values.platformWorker.nativeMetadataGateway.enabled }}
          ports:
            - name: native-metadata
              containerPort: {{ .Values.platformWorker.nativeMetadataGateway.port }}
              protocol: TCP
          {{- end }}
          {{- if .Values.workloadTopology.enabled }}
          command: ["node", "-e"]
          args: ["setInterval(() => undefined, 60000)"]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            {{- if not .Values.workloadTopology.enabled }}
            - name: PLATFORM_WORKER_DEPLOYMENT_MODULE
              value: {{ required "platformWorker.deploymentModule must name a module packaged in the deployment image" .Values.platformWorker.deploymentModule | quote }}
            - name: PLATFORM_WORKER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PLATFORM_WORKER_WECOM_ENABLED
              value: {{ .Values.platformWorker.wecomEnabled | quote }}
            - name: PLATFORM_WORKER_SERVICE_TOKEN_FILE
              value: /var/run/agent-infra/runtime-auth/service-token
            {{- if .Values.platformWorker.runtimeImageRepository }}
            - name: AGENT_INFRA_RUNTIME_IMAGE_REPOSITORY
              value: {{ .Values.platformWorker.runtimeImageRepository | quote }}
            - name: AGENT_INFRA_RUNTIME_IMAGE_DIGEST
              value: {{ required "platformWorker.runtimeImageDigest is required with runtimeImageRepository" .Values.platformWorker.runtimeImageDigest | quote }}
            {{- end }}
            {{- end }}
            - name: PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretRef.name }}
                  key: {{ .Values.database.secretRef.key }}
            - name: AGENT_INFRA_WORKER_KEYRING_FILE
              value: /var/run/agent-infra/keyring/keyring.pem
            - name: AGENT_INFRA_WORKER_KEY_VERSIONS
              value: {{ join "," .Values.keys.workerDecryptionKeyring.versions | quote }}
            {{- if and (not .Values.workloadTopology.enabled) $caRef.name }}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/agent-infra/trusted-ca/ca.crt
            {{- end }}
            {{- include "agent-infra.connectionEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $bindings }}
            {{- include "agent-infra.connectionEnvFrom" . | nindent 12 }}
          volumeMounts:
            {{- if not .Values.workloadTopology.enabled }}
            - name: deployment-module
              mountPath: /app/dist/configuration.mjs
              subPath: {{ required "platformWorker.configurationModuleSecretRef.key is required" $moduleRef.key }}
              readOnly: true
            - name: deployment-module
              mountPath: /var/run/agent-infra/deployment
              readOnly: true
            - name: runtime-auth
              mountPath: /var/run/agent-infra/runtime-auth
              readOnly: true
            {{- if $caRef.name }}
            - name: trusted-ca
              mountPath: /var/run/agent-infra/trusted-ca
              readOnly: true
            {{- end }}
            {{- end }}
            - name: decryption-keyring
              mountPath: /var/run/agent-infra/keyring
              readOnly: true
      volumes:
        {{- if not .Values.workloadTopology.enabled }}
        - name: deployment-module
          secret:
            secretName: {{ required "platformWorker.configurationModuleSecretRef is required for production Worker" $moduleRef.name }}
            defaultMode: 288
        - name: runtime-auth
          secret:
            secretName: {{ required "platformWorker.runtimeAuthSecretRef is required for production Worker" $authRef.name }}
            defaultMode: 288
            items:
              - key: {{ required "platformWorker.runtimeAuthSecretRef.privateKeyKey is required" $authRef.privateKeyKey }}
                path: runtime-grant.pem
              - key: {{ required "platformWorker.runtimeAuthSecretRef.serviceTokenKey is required" $authRef.serviceTokenKey }}
                path: service-token
        {{- if $caRef.name }}
        - name: trusted-ca
          secret:
            secretName: {{ $caRef.name }}
            defaultMode: 288
            items:
              - key: {{ $caRef.key }}
                path: ca.crt
        {{- end }}
        {{- end }}
        - name: decryption-keyring
          secret:
            secretName: {{ .Values.keys.workerDecryptionKeyring.secretRef.name }}
            items:
              - key: {{ .Values.keys.workerDecryptionKeyring.secretRef.key }}
                path: keyring.pem
{{- if .Values.platformWorker.nativeMetadataGateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-native-metadata
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-worker
  ports:
    - name: native-metadata
      port: {{ .Values.platformWorker.nativeMetadataGateway.port }}
      targetPort: native-metadata
      protocol: TCP
---
# Stable in-cluster origin used by Session Sandbox Runtime Hosts. Keep the
# release-scoped Service above for existing Platform API configuration while
# exposing the fixed DNS name required by the Runtime auth policy.
apiVersion: v1
kind: Service
metadata:
  name: platform-worker-native-metadata
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-worker
  ports:
    - name: native-metadata
      port: {{ .Values.platformWorker.nativeMetadataGateway.port }}
      targetPort: native-metadata
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-native-metadata
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: platform-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: platform-api
      ports:
        - protocol: TCP
          port: {{ .Values.platformWorker.nativeMetadataGateway.port }}
    - from:
        - podSelector:
            matchLabels:
              agent-infra.agora.io/managed: session-sandbox-v1
            matchExpressions:
              - key: agent-infra.agora.io/sandbox-id
                operator: Exists
              - key: agent-infra.agora.io/agent-ref
                operator: Exists
              - key: agent-infra.agora.io/session-ref
                operator: Exists
              - key: agent-infra.agora.io/generation
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.platformWorker.nativeMetadataGateway.port }}
---
# Keep the API egress half separate from the Worker ingress policy. Other
# deployment-owned API egress policies remain additive with this rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-native-metadata-api-egress
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: platform-api
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: platform-worker
      ports:
        - protocol: TCP
          port: {{ .Values.platformWorker.nativeMetadataGateway.port }}
{{- end }}

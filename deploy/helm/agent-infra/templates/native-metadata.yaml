{{- if .Values.nativeMetadata.enabled -}}
{{- $name := include "agent-infra.componentName" (dict "root" . "suffix" "metadata-worker") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-worker
  ports:
    - name: native-metadata
      port: {{ .Values.nativeMetadata.workerPort }}
      targetPort: {{ .Values.nativeMetadata.workerPort }}
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-infra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: platform-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- include "agent-infra.nativeMetadataPeer" .Values.nativeMetadata.apiPeer | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ .Values.nativeMetadata.workerPort }}
    - from:
        - {{- include "agent-infra.nativeMetadataPeer" .Values.nativeMetadata.hostPeer | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ .Values.nativeMetadata.workerPort }}
{{- end }}

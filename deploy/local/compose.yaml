services:
  postgres:
    # docker 守护进程重启后自动恢复长期服务，unless-stopped 在显式 stop/down 后不会重启。
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_POSTGRES_PORT:-54329}:5432"

  web:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_WEB_PORT:-3001}:8443"
    volumes:
      # Web 入口脚本从这个模板渲染 /tmp/nginx-conf/default.conf，nginx 只加载渲染结果（#2975、#3005）。
      - ${PLATFORM_LOCAL_NGINX_CONFIG:?Render the local nginx configuration first}:/etc/nginx/conf.d/default.conf.template:ro
      - ${PLATFORM_WEB_TLS_CERT_FILE:?Set the local TLS certificate file}:/var/run/platform-web/tls.crt:ro
      - ${PLATFORM_WEB_TLS_KEY_FILE:?Set the local TLS key file}:/var/run/platform-web/tls.key:ro
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]

  platform-api:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_API_PORT:-3000}:3000"
    environment:
      PLATFORM_DATABASE_URL: postgresql://agent_infra:agent_infra_local@postgres:5432/agent_infra
      PLATFORM_API_DEPLOYMENT_MODULE: file:///app/dist/deployment.mjs
      PLATFORM_API_CONFIGURATION_MODULE: file:///app/deployment/configuration.mjs
      PLATFORM_API_PROXY_TOKEN_FILE: /run/secrets/platform_proxy_token
      PLATFORM_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:-https://localhost:3001}
      NODE_EXTRA_CA_CERTS: /run/secrets/directory_ca
      PLATFORM_API_NATIVE_METADATA_WORKER_ORIGIN: ${PLATFORM_LOCAL_NATIVE_METADATA_WORKER_ORIGIN:-}
      PLATFORM_API_NATIVE_METADATA_WORKER_SERVICE_TOKEN_FILE: /run/secrets/platform_native_metadata_worker_token
      PLATFORM_API_NATIVE_METADATA_WORKER_LOCAL: "true"
      # Container path of the deployment-owned file-plane configuration. Empty
      # keeps file routes unregistered; a set but incomplete file fails startup.
      PLATFORM_API_FILE_DEPLOYMENT_CONFIGURATION_FILE: ${PLATFORM_LOCAL_API_FILE_DEPLOYMENT_CONFIGURATION_FILE:-}
      AGENT_INFRA_AGENT_VERSION: ${AGENT_INFRA_AGENT_VERSION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "platform-worker-native-metadata:${PLATFORM_LOCAL_NATIVE_METADATA_WORKER_BIND_ADDRESS:-host-gateway}"
      - "${PLATFORM_LOCAL_LDAP_HOST:?Set the private LDAP host name}:${PLATFORM_LOCAL_LDAP_HOST_IP:?Set the private LDAP host IP}"
    volumes:
      - ${PLATFORM_LOCAL_API_DIRECTORY:?Set the API-only deployment directory}:/app/deployment:ro
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/tls.crt:/run/secrets/directory_ca:ro
    secrets:
      - platform_proxy_token
      - platform_native_metadata_worker_token
    depends_on:
      postgres:
        condition: service_healthy
      enterprise-directory-sync:
        condition: service_healthy

  enterprise-directory-migration:
    image: ${PLATFORM_LOCAL_DIRECTORY_IMAGE:?Set the local directory sync image}
    build: !reset null
    environment:
      DIRECTORY_MIGRATION_DATABASE_URL: ${PLATFORM_LOCAL_DIRECTORY_MIGRATION_DATABASE_URL:?Set the private directory migration URL}
      DIRECTORY_RUNTIME_DATABASE_ROLE: ${PLATFORM_LOCAL_DIRECTORY_RUNTIME_DATABASE_ROLE:?Set the private directory runtime role}
    profiles: ["enterprise-directory"]
    depends_on:
      postgres:
        condition: service_healthy

  enterprise-directory-sync:
    restart: unless-stopped
    image: ${PLATFORM_LOCAL_DIRECTORY_IMAGE:?Set the local directory sync image}
    build: !reset null
    environment:
      DIRECTORY_ROOT_DEPARTMENT_ID: ${PLATFORM_LOCAL_DIRECTORY_ROOT_DEPARTMENT_ID:-1}
      WECOM_CORP_ID: ${PLATFORM_LOCAL_DIRECTORY_CORP_ID:?Set the private directory Corp ID}
      DIRECTORY_DATABASE_URL: ${PLATFORM_LOCAL_DIRECTORY_DATABASE_URL:?Set the private directory runtime URL}
      DIRECTORY_SOURCE_MODULE: file:///app/directory-source/source.ts
      DIRECTORY_READ_TOKEN_FILE: /run/secrets/directory_read_token
      DIRECTORY_TLS_CERT_FILE: /run/secrets/directory_tls_cert
      DIRECTORY_TLS_KEY_FILE: /run/secrets/directory_tls_key
    volumes:
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/source.ts:/app/directory-source/source.ts:ro
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/adapter.ts:/app/directory-source/adapter.ts:ro
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/package.json:/app/directory-source/package.json:ro
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/read-token:/run/secrets/directory_read_token:ro
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/tls.crt:/run/secrets/directory_tls_cert:ro
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/tls.key:/run/secrets/directory_tls_key:ro
      - ${PLATFORM_LOCAL_DIRECTORY_SOURCE_DIR:?Set the private directory source directory}/agora-service-key:/run/secrets/agora_service_key:ro
    extra_hosts:
      - "${PLATFORM_LOCAL_DIRECTORY_SOURCE_HOST:?Set the private enterprise source host name}:${PLATFORM_LOCAL_DIRECTORY_SOURCE_HOST_IP:?Set the private enterprise source host IP}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://enterprise-directory-sync:3004/readyz',{ca:require('fs').readFileSync('/run/secrets/directory_tls_cert')},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    profiles: ["enterprise-directory"]
    depends_on:
      enterprise-directory-migration:
        condition: service_completed_successfully

  object-storage:
    restart: unless-stopped
    image: cgr.dev/chainguard/minio@sha256:4d397a26fe49d7f9ed39b8b566534848936f7efa50ab6328ac97b2a44eeabf4c
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_OBJECT_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${PLATFORM_LOCAL_OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=\"http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@127.0.0.1:9000\" mc ready --quiet local >/dev/null"]

secrets:
  platform_proxy_token:
    file: ${PLATFORM_LOCAL_PROXY_RUNTIME_TOKEN_FILE:?Render the local proxy token first}
  platform_native_metadata_worker_token:
    file: ${PLATFORM_LOCAL_NATIVE_METADATA_WORKER_TOKEN_FILE:?Prepare the local native metadata Worker token first}

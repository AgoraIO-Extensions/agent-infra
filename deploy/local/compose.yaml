services:
  postgres:
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_POSTGRES_PORT:-54329}:5432"

  web:
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_WEB_PORT:-3001}:8443"
    volumes:
      - ${PLATFORM_LOCAL_NGINX_CONFIG:?Render the local nginx configuration first}:/etc/nginx/conf.d/default.conf:ro
      - ${PLATFORM_WEB_TLS_CERT_FILE:?Set the local TLS certificate file}:/var/run/platform-web/tls.crt:ro
      - ${PLATFORM_WEB_TLS_KEY_FILE:?Set the local TLS key file}:/var/run/platform-web/tls.key:ro
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]

  platform-api:
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_API_PORT:-3000}:3000"
    environment:
      PLATFORM_DATABASE_URL: postgresql://agent_infra:agent_infra_local@postgres:5432/agent_infra
      PLATFORM_API_DEPLOYMENT_MODULE: file:///app/dist/deployment.mjs
      PLATFORM_API_CONFIGURATION_MODULE: file:///app/deployment/configuration.mjs
      PLATFORM_API_PROXY_TOKEN_FILE: /run/secrets/platform_proxy_token
    volumes:
      - ${PLATFORM_LOCAL_API_DIRECTORY:?Set the API-only deployment directory}:/app/deployment:ro
    secrets:
      - platform_proxy_token
    depends_on:
      postgres:
        condition: service_healthy

  object-storage:
    image: cgr.dev/chainguard/minio@sha256:4d397a26fe49d7f9ed39b8b566534848936f7efa50ab6328ac97b2a44eeabf4c
    ports: !override
      - "127.0.0.1:${PLATFORM_LOCAL_OBJECT_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${PLATFORM_LOCAL_OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=\"http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@127.0.0.1:9000\" mc ready --quiet local >/dev/null"]

secrets:
  platform_proxy_token:
    file: ${PLATFORM_LOCAL_PROXY_RUNTIME_TOKEN_FILE:?Render the local proxy token first}

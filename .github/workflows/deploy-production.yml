name: Deploy production
run-name: ${{ github.event_name }} | deploy-production | ${{ inputs.command }}
on:
  workflow_dispatch:
    inputs:
      command:
        description: Executor command
        required: true
        type: choice
        options: [status, diff, deploy, verify, accept, rollback]
        default: status
      helm_commit:
        description: Expected Helm deployment repository main commit (40-hex); empty accepts the current main
        required: false
        type: string
        default: ""
      version:
        description: Published and mirrored vX.Y.Z; empty retains the deployed version
        required: false
        type: string
        default: ""
      revision:
        description: Rollback only; the target Helm revision
        required: false
        type: string
        default: ""
permissions: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  plan:
    name: Plan
    if: github.repository == 'AgoraIO-Extensions/agent-infra' && github.ref == 'refs/heads/main'
    runs-on: agent-infra-deploy
    environment: production
    timeout-minutes: 60
    env:
      # Abort a GitHub fetch that stalls below 100 KiB/s for 20 s so it is retried, instead of
      # hanging until the connection resets (observed from the cluster).
      GIT_HTTP_LOW_SPEED_LIMIT: "102400"
      GIT_HTTP_LOW_SPEED_TIME: "20"
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      helm_commit: ${{ steps.plan.outputs.helm_commit }}
      release_identity: ${{ steps.plan.outputs.release_identity }}
      apply: ${{ steps.plan.outputs.apply }}
      approval_required: ${{ steps.plan.outputs.approval_required }}
      approval_reasons: ${{ steps.plan.outputs.approval_reasons }}
    steps:
      - name: Download trusted executor code
        env:
          EXECUTOR_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXECUTOR_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          archive="$RUNNER_TEMP/executor.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
            "https://codeload.github.com/AgoraIO-Extensions/agent-infra/tar.gz/$EXECUTOR_SOURCE_SHA" --output "$archive"
          metadata="$RUNNER_TEMP/executor-commit.json"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 20 --retry 3 --retry-all-errors \
            "https://api.github.com/repos/AgoraIO-Extensions/agent-infra/git/commits/$EXECUTOR_SOURCE_SHA" --output "$metadata"
          expected_tree=$(/home/runner/externals/node24/bin/node -e '
            const m=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));
            if(m.sha!==process.env.EXECUTOR_SOURCE_SHA||!/^[a-f0-9]{40}$/.test(m.tree?.sha??""))throw new Error("EXECUTOR_SOURCE_COMMIT_MISMATCH");
            process.stdout.write(m.tree.sha);' "$metadata")
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" -c core.autocrlf=false -c core.filemode=true add --force --all
          if [[ "$(git -C "$GITHUB_WORKSPACE" write-tree)" != "$expected_tree" ]]; then
            echo "EXECUTOR_SOURCE_TREE_MISMATCH" >&2
            exit 1
          fi
          runner_node=/home/runner/externals/node24/bin
          "$runner_node/node" -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1)'
          echo "$runner_node" >> "$GITHUB_PATH"
      - name: Install deploy tools
        run: bash deploy/ack/install-deploy-tools.sh
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_COMMAND: ${{ inputs.command }}
          DEPLOY_HELM_COMMIT: ${{ inputs.helm_commit }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          KUBERNETES_OIDC_AUDIENCE: ${{ vars.KUBERNETES_OIDC_AUDIENCE }}
        run: node deploy/ack/production-deploy.ts plan
      - name: Upload plan receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: deploy-plan-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-receipt.json
          if-no-files-found: ignore
  approve:
    name: Approve
    needs: plan
    if: needs.plan.outputs.approval_required == 'true'
    runs-on: ubuntu-24.04
    environment: production-approval
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record approval
        env:
          HELM_COMMIT: ${{ needs.plan.outputs.helm_commit }}
          REASONS: ${{ needs.plan.outputs.approval_reasons }}
        run: echo "Approved Helm deployment repository commit $HELM_COMMIT for $REASONS"
  apply:
    name: Apply
    needs: [plan, approve]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.apply == 'true' &&
      (needs.approve.result == 'success' ||
      (needs.approve.result == 'skipped' && needs.plan.outputs.approval_required == 'false'))
    runs-on: agent-infra-deploy
    environment: production
    timeout-minutes: 120
    env:
      # Abort a GitHub fetch that stalls below 100 KiB/s for 20 s so it is retried, instead of
      # hanging until the connection resets (observed from the cluster).
      GIT_HTTP_LOW_SPEED_LIMIT: "102400"
      GIT_HTTP_LOW_SPEED_TIME: "20"
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download trusted executor code
        env:
          EXECUTOR_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXECUTOR_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          archive="$RUNNER_TEMP/executor.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
            "https://codeload.github.com/AgoraIO-Extensions/agent-infra/tar.gz/$EXECUTOR_SOURCE_SHA" --output "$archive"
          metadata="$RUNNER_TEMP/executor-commit.json"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 20 --retry 3 --retry-all-errors \
            "https://api.github.com/repos/AgoraIO-Extensions/agent-infra/git/commits/$EXECUTOR_SOURCE_SHA" --output "$metadata"
          expected_tree=$(/home/runner/externals/node24/bin/node -e '
            const m=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));
            if(m.sha!==process.env.EXECUTOR_SOURCE_SHA||!/^[a-f0-9]{40}$/.test(m.tree?.sha??""))throw new Error("EXECUTOR_SOURCE_COMMIT_MISMATCH");
            process.stdout.write(m.tree.sha);' "$metadata")
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" -c core.autocrlf=false -c core.filemode=true add --force --all
          if [[ "$(git -C "$GITHUB_WORKSPACE" write-tree)" != "$expected_tree" ]]; then
            echo "EXECUTOR_SOURCE_TREE_MISMATCH" >&2
            exit 1
          fi
          runner_node=/home/runner/externals/node24/bin
          "$runner_node/node" -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1)'
          echo "$runner_node" >> "$GITHUB_PATH"
      - name: Install deploy tools
        run: bash deploy/ack/install-deploy-tools.sh
      - name: Apply
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_COMMAND: ${{ inputs.command }}
          DEPLOY_HELM_COMMIT: ${{ inputs.helm_commit }}
          DEPLOY_REVISION: ${{ inputs.revision }}
          KUBERNETES_OIDC_AUDIENCE: ${{ vars.KUBERNETES_OIDC_AUDIENCE }}
          PLANNED_RELEASE: ${{ needs.plan.outputs.release_identity }}
          PLANNED_HELM_COMMIT: ${{ needs.plan.outputs.helm_commit }}
          PLANNED_REASONS: ${{ needs.plan.outputs.approval_reasons }}
          APPROVAL_RESULT: ${{ needs.approve.result }}
        run: node deploy/ack/production-deploy.ts apply
      - name: Upload apply receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: deploy-apply-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-receipt.json
          if-no-files-found: ignore

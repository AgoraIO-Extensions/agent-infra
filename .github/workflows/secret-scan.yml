name: Secret scan
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('PR #{0} | secret-scan | pull_request', github.event.pull_request.number) ||
    format('{0} | secret-scan | push', github.ref_name)
  }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download_directory="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${download_directory}"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${download_directory}/${archive}"
          actual_sha256="$(sha256sum "${download_directory}/${archive}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${GITLEAKS_LINUX_X64_SHA256}" ]]; then
            printf 'gitleaks checksum mismatch: expected %s, got %s\n' \
              "${GITLEAKS_LINUX_X64_SHA256}" "${actual_sha256}" >&2
            exit 1
          fi
          tar -xzf "${download_directory}/${archive}" -C "${download_directory}" gitleaks
          echo "${download_directory}" >> "${GITHUB_PATH}"

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            log_opts="--all"
          else
            log_opts="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="${log_opts}"

name: PR-Agent Review
run-name: >-
  ${{ format('PR #{0} | pr-agent-review | {1}', github.event.pull_request.number, github.event.action) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]

permissions: {}

concurrency:
  group: pr-agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: PR-Agent Analysis
    if: >-
      vars.PR_REVIEW_PROVIDER != 'claude' &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Review pull request
        id: pr-agent
        # qodo-ai/pr-agent redirects to The-PR-Agent/pr-agent (repository 662766482).
        uses: The-PR-Agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI__KEY: ${{ secrets.PR_AGENT_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          config.model: ${{ secrets.PR_AGENT_MODEL }}
          config.propagate_tool_errors: "true"
          config.publish_output: "true"
          config.publish_output_progress: "false"
          config.restricted_mode: "true"
          config.use_repo_settings_file: "false"
          config.use_wiki_settings_file: "false"
          config.fallback_models: "[]"
          config.ai_timeout: ${{ vars.PR_AGENT_AI_TIMEOUT_SECONDS || '120' }}
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_MODEL_MAX_TOKENS || '128000' }}
          config.max_model_tokens: ${{ vars.PR_AGENT_MODEL_MAX_TOKENS || '128000' }}
          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.enable_review_labels_security: "false"
          pr_reviewer.num_max_findings: "10"
          pr_reviewer.require_can_be_split_review: "false"
          pr_reviewer.require_estimate_contribution_time_cost: "false"
          pr_reviewer.require_estimate_effort_to_review: "false"
          pr_reviewer.require_score_review: "false"
          pr_reviewer.require_security_review: "false"
          pr_reviewer.require_tests_review: "false"
          pr_reviewer.require_ticket_analysis_review: "false"
          pr_reviewer.require_todo_scan: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: >-
            ["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]

  suggestions:
    name: PR-Agent Suggestions
    if: >-
      vars.PR_REVIEW_PROVIDER != 'claude' &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Generate optional code suggestions
        id: pr-agent-suggestions
        continue-on-error: true
        # qodo-ai/pr-agent redirects to The-PR-Agent/pr-agent (repository 662766482).
        uses: The-PR-Agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI__KEY: ${{ secrets.PR_AGENT_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          config.model: ${{ secrets.PR_AGENT_MODEL }}
          config.propagate_tool_errors: "true"
          config.publish_output: "true"
          config.publish_output_progress: "false"
          config.restricted_mode: "true"
          config.use_repo_settings_file: "false"
          config.use_wiki_settings_file: "false"
          config.fallback_models: "[]"
          config.ai_timeout: ${{ vars.PR_AGENT_AI_TIMEOUT_SECONDS || '120' }}
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_MODEL_MAX_TOKENS || '128000' }}
          config.max_model_tokens: ${{ vars.PR_AGENT_MODEL_MAX_TOKENS || '128000' }}
          pr_code_suggestions.commitable_code_suggestions: "true"
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: >-
            ["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]

  coverage:
    name: Publish Automated Review Coverage
    needs: analyze
    continue-on-error: true
    if: >-
      always() &&
      vars.PR_REVIEW_PROVIDER != 'claude' &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Mint Gate publisher token
        id: gate-publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TEAM_MEMBERSHIP_APP_ID }}
          permission-checks: write
          private-key: ${{ secrets.TEAM_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Publish Automated Review Coverage
        if: always()
        env:
          GATE_CHECK_TOKEN: ${{ steps.gate-publisher-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_PROVIDER: pr-agent
          REVIEW_RUN_RESULT: ${{ needs.analyze.result }}
        run: node .github/scripts/review-coverage.mjs

  outcome:
    name: Publish terminal outcome
    needs: [analyze, suggestions]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ""
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: pr-agent-review
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: "PR #${{ github.event.pull_request.number }}"
          SUMMARY_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

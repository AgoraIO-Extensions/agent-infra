name: PR-Agent Repair Smoke 431
on:
  push:
    branches:
      - verify/431-pr-agent-review
permissions: {}
jobs:
  analyze:
    name: PR-Agent Analysis
    outputs:
      review: ${{ steps.pr-agent.outputs.review }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff7fb29d7da5bbfb72f222ec9734ef5298045015
          fetch-depth: 1
          persist-credentials: false
      - &a1
        name: Bind smoke to PR 433 and implementation head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh api repos/AgoraIO-Extensions/agent-infra/pulls/433 > "$RUNNER_TEMP/target-pr.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pr=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/target-pr.json','utf8'));
          if(pr.head.sha!=='ff7fb29d7da5bbfb72f222ec9734ef5298045015' || pr.state!=='open') throw new Error('Smoke target changed');
          fs.writeFileSync('.pr-agent-event.json',JSON.stringify({action:'synchronize',pull_request:pr,repository:{full_name:'AgoraIO-Extensions/agent-infra',default_branch:'main'},sender:{type:'User'}}));
          JS
      - name: Review pull request
        id: pr-agent
        uses: docker://pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LITELLM_ROUTE_ALL_CHAT_OPENAI_TO_RESPONSES: "true"
          OPENAI__KEY: ${{ secrets.PR_AGENT_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          config.model: ${{ secrets.PR_AGENT_MODEL }}
          config.propagate_tool_errors: "true"
          config.publish_output: "false"
          github_action_config.enable_output: "true"
          pr_reviewer.persistent_comment: "false"
          pr_reviewer.persistent_finding_state: "false"
          pr_reviewer.extra_instructions: Return exactly one YAML object with the
            top-level key review. Nest key_issues_to_review under review,
            including when it is an empty list. Never return
            key_issues_to_review at the top level.
          config.publish_output_progress: "false"
          config.restricted_mode: "true"
          config.use_repo_settings_file: "false"
          config.use_wiki_settings_file: "false"
          config.fallback_models: "[]"
          config.ai_timeout: ${{ vars.PR_AGENT_AI_TIMEOUT_SECONDS || '120' }}
          config.custom_model_max_tokens: ${{ vars.PR_AGENT_MODEL_MAX_TOKENS || '128000' }}
          config.max_model_tokens: ${{ vars.PR_AGENT_MODEL_MAX_TOKENS || '128000' }}
          litellm.custom_llm_provider: openai
          litellm.force_streaming_custom_llm_provider: openai
          litellm.force_streaming_api_base_substrings: '["https://"]'
          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_reviewer.enable_review_labels_effort: "false"
          pr_reviewer.enable_review_labels_security: "false"
          pr_reviewer.enable_large_pr_chunking: "true"
          pr_reviewer.max_number_of_calls: "3"
          pr_reviewer.num_max_findings: "10"
          pr_reviewer.require_can_be_split_review: "false"
          pr_reviewer.require_estimate_contribution_time_cost: "false"
          pr_reviewer.require_estimate_effort_to_review: "false"
          pr_reviewer.require_score_review: "false"
          pr_reviewer.require_security_review: "false"
          pr_reviewer.require_tests_review: "false"
          pr_reviewer.require_ticket_analysis_review: "false"
          pr_reviewer.require_todo_scan: "false"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize",
            "ready_for_review", "review_requested"]'
        with:
          entrypoint: /bin/sh
          args: -c 'GITHUB_EVENT_NAME=pull_request_target
            GITHUB_EVENT_PATH=/github/workspace/.pr-agent-event.json
            /entrypoint.sh'
  publish:
    name: PR-Agent Publish Review
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      review_receipt: ${{ steps.publish-review.outputs.receipt }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff7fb29d7da5bbfb72f222ec9734ef5298045015
          fetch-depth: 1
          persist-credentials: false
      - *a1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Reject malformed model output before any publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AGENT_REVIEW: "{}"
        run: >-
          if GITHUB_EVENT_PATH="$PWD/.pr-agent-event.json" node
          .github/scripts/pr-agent-review.mjs; then
            echo 'Malformed output unexpectedly passed'
            exit 1
          fi

          echo 'Malformed review rejected before publication'
      - name: Validate and publish Review
        id: publish-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AGENT_REVIEW: ${{ needs.analyze.outputs.review }}
        run: GITHUB_EVENT_PATH="$PWD/.pr-agent-event.json" node
          .github/scripts/pr-agent-review.mjs
  coverage:
    name: Publish Automated Review Coverage
    needs:
      - analyze
      - publish
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff7fb29d7da5bbfb72f222ec9734ef5298045015
          fetch-depth: 1
          persist-credentials: false
      - *a1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Mint Gate publisher token
        id: gate-publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.TEAM_MEMBERSHIP_APP_ID }}
          permission-checks: write
          private-key: ${{ secrets.TEAM_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Prove missing receipt fails the required Coverage check
        if: always()
        env:
          GATE_CHECK_TOKEN: ${{ steps.gate-publisher-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: "433"
          REVIEW_PROVIDER: pr-agent
          REVIEW_RUN_RESULT: ${{ needs.analyze.result != 'success' && needs.analyze.result
            || needs.publish.result }}
          PR_AGENT_REVIEW_RECEIPT: ""
        run: |-
          GITHUB_EVENT_PATH="$PWD/.pr-agent-event.json" node .github/scripts/review-coverage.mjs
          conclusion=$(gh api 'repos/AgoraIO-Extensions/agent-infra/commits/ff7fb29d7da5bbfb72f222ec9734ef5298045015/check-runs?per_page=100' --jq '.check_runs | map(select(.name=="Automated Review Coverage" and .app.id==4503079)) | sort_by(.id) | last | .conclusion')
          test "$conclusion" = failure
          echo 'Missing publication receipt produced a failing required Coverage check'
      - name: Publish Automated Review Coverage
        if: always()
        env:
          GATE_CHECK_TOKEN: ${{ steps.gate-publisher-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: "433"
          REVIEW_PROVIDER: pr-agent
          REVIEW_RUN_RESULT: ${{ needs.analyze.result != 'success' && needs.analyze.result
            || needs.publish.result }}
          PR_AGENT_REVIEW_RECEIPT: ${{ needs.publish.outputs.review_receipt }}
        run: GITHUB_EVENT_PATH="$PWD/.pr-agent-event.json" node
          .github/scripts/review-coverage.mjs

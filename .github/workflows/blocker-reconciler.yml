name: Blocker Reconciler
run-name: >-
  ${{
    github.event_name == 'issues' &&
    format('Issue #{0} | blocker-reconcile | {1}', github.event.issue.number, github.event.action) ||
    format('reconcile | blocker-reconcile | {0}', github.event_name)
  }}

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: blocker-graph-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile blocker graph
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Reconcile trusted blocker state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/blocker-reconciler.mjs

  outcome:
    name: Publish terminal outcome
    needs: [reconcile]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ""
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ github.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: blocker-reconcile
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: "${{ github.event_name == 'issues' && format('Issue #{0}', github.event.issue.number) || 'reconcile' }}"
          SUMMARY_TARGET_URL: ${{ github.event_name == 'issues' && format('{0}/{1}/issues/{2}', github.server_url, github.repository, github.event.issue.number) || format('{0}/{1}', github.server_url, github.repository) }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Connection GitHub E2E
run-name: >-
  ${{ github.event_name }} | connection-github-e2e | ${{ github.run_id }}

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [full, commit-reaction, merge]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: connection-github-e2e
  cancel-in-progress: false

jobs:
  merge:
    name: GitHub isolated merge conformance
    if: vars.CONNECTION_GITHUB_E2E_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/connection' && inputs.suite == 'merge'
    environment: connection-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run isolated GitHub merge conformance
        env:
          CONNECTION_E2E_TOKEN: ${{ secrets.CONNECTION_E2E_TOKEN }}
          CONNECTION_GITHUB_E2E_ENABLED: "true"
        run: node tests/github-merge-e2e.mjs "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-merge-e2e-result.json
      - name: Upload merge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: connection-github-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: connection-github-merge-e2e-result.json
          retention-days: 30

  commit-reaction:
    name: GitHub commit and reaction conformance
    if: vars.CONNECTION_GITHUB_E2E_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/connection' && inputs.suite == 'commit-reaction'
    environment: connection-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run commit and reaction conformance
        env:
          CONNECTION_E2E_TOKEN: ${{ secrets.CONNECTION_E2E_TOKEN }}
          CONNECTION_GITHUB_E2E_ENABLED: "true"
        run: node tests/github-commit-reaction-e2e.mjs "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | tee connection-github-commit-reaction-e2e-result.json
      - name: Upload commit and reaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: connection-github-commit-reaction-${{ github.run_id }}
          path: connection-github-commit-reaction-e2e-result.json
          retention-days: 30

  reviewer-health:
    name: GitHub Reviewer v2 health
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/connection'
    environment: connection-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run read-only GitHub Reviewer v2 health probe
        env:
          CONNECTION_E2E_REVIEWER_TOKEN: ${{ secrets.CONNECTION_E2E_REVIEWER_TOKEN_V2 }}
        run: node tests/github-review-health.mjs | tee connection-github-review-health-result.json
      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: connection-github-review-health-${{ github.run_id }}
          path: connection-github-review-health-result.json
          retention-days: 30

  conformance:
    name: GitHub issue conformance
    if: >-
      vars.CONNECTION_GITHUB_E2E_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/connection' &&
      inputs.suite == 'full'
    environment: connection-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run deterministic Connection GitHub conformance
        env:
          CONNECTION_E2E_REVIEWER_TOKEN: ${{ secrets.CONNECTION_E2E_REVIEWER_TOKEN_V2 }}
          CONNECTION_E2E_TOKEN: ${{ secrets.CONNECTION_E2E_TOKEN }}
          CONNECTION_E2E_SKIP_COMMIT_REACTION: "true"
          CONNECTION_GITHUB_E2E_ENABLED: "true"
        shell: bash
        run: |
          set -o pipefail
          set +e
          node tests/github-review-e2e.mjs \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-review-e2e-result.json
          review_status=${PIPESTATUS[0]}
          node tests/github-pr-collaboration-e2e.mjs \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-pr-collaboration-e2e-result.json
          collaboration_status=${PIPESTATUS[0]}
          node tests/github-connection-e2e.mjs \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-e2e-result.json
          issue_status=${PIPESTATUS[0]}
          node tests/github-connection-e2e.mjs read \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-read-e2e-result.json
          read_status=${PIPESTATUS[0]}
          if [ "$read_status" -eq 0 ]; then
            node tests/github-low-risk-write-e2e.mjs \
              "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-write-e2e-result.json
            write_status=${PIPESTATUS[0]}
          else
            write_status=1
            echo '{"outcome":"SKIPPED","reason":"read conformance failed"}' > connection-github-write-e2e-result.json
          fi
          node tests/github-commit-reaction-e2e.mjs \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-commit-reaction-e2e-result.json
          commit_reaction_status=${PIPESTATUS[0]}
          if [ "$read_status" -ne 0 ] || [ "$write_status" -ne 0 ] || [ "$issue_status" -ne 0 ] || [ "$review_status" -ne 0 ] || [ "$collaboration_status" -ne 0 ] || [ "$commit_reaction_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: connection-github-e2e-${{ github.run_id }}
          path: |
            connection-github-e2e-result.json
            connection-github-commit-reaction-e2e-result.json
            connection-github-read-e2e-result.json
            connection-github-pr-collaboration-e2e-result.json
            connection-github-review-e2e-result.json
            connection-github-write-e2e-result.json
          retention-days: 30

  outcome:
    name: Publish terminal outcome
    needs: [reviewer-health, conformance, commit-reaction, merge]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ${{ github.run_attempt }}
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ github.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: connection-github-e2e
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: Connection GitHub E2E
          SUMMARY_TARGET_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Connection GitHub E2E
run-name: >-
  ${{ github.event_name }} | connection-github-e2e | ${{ github.run_id }}

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connection-github-e2e
  cancel-in-progress: false

jobs:
  conformance:
    name: GitHub issue conformance
    if: vars.CONNECTION_GITHUB_E2E_ENABLED == 'true'
    environment: connection-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run deterministic Connection GitHub conformance
        env:
          CONNECTION_E2E_TOKEN: ${{ secrets.CONNECTION_E2E_TOKEN }}
          CONNECTION_GITHUB_E2E_ENABLED: "true"
        shell: bash
        run: |
          set -o pipefail
          node tests/github-connection-e2e.mjs \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee connection-github-e2e-result.json

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: connection-github-e2e-${{ github.run_id }}
          path: connection-github-e2e-result.json
          retention-days: 30

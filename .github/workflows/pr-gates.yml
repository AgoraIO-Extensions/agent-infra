name: PR Gates
run-name: >-
  ${{ format('PR #{0} | pr-gates | {1}', github.event.pull_request.number, github.event.action) }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions: {}

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue:
    name: Issue Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check primary Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-gates.mjs issue

  human:
    name: Human Validation Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Mint Team membership token
        id: team-membership-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TEAM_MEMBERSHIP_APP_ID }}
          permission-members: read
          private-key: ${{ secrets.TEAM_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check human validation
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_MEMBERSHIP_TOKEN: ${{ steps.team-membership-token.outputs.token }}
        run: node .github/scripts/pr-gates.mjs human

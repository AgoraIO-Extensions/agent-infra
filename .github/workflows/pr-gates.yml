name: PR Gates
run-name: >-
  ${{
    github.event_name == 'pull_request_target' &&
    format('PR #{0} | pr-gates | {1}', github.event.pull_request.number, github.event.action) ||
    github.event_name == 'repository_dispatch' &&
    format('PR #{0} | pr-gates | repository_dispatch', github.event.client_payload.pr_number) ||
    github.event_name == 'issue_comment' && github.event.issue.pull_request &&
    format('PR #{0} | pr-gates | {1}', github.event.issue.number, github.event.action) ||
    github.event_name == 'issue_comment' &&
    format('Issue #{0} | pr-gates | {1}', github.event.issue.number, github.event.action) ||
    github.event_name == 'issues' &&
    format('Issue #{0} | pr-gates | {1}', github.event.issue.number, github.event.action) ||
    'reconcile | pr-gates | schedule'
  }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  issues:
    types: [closed, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  repository_dispatch:
    types: [pr-gates]
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.event.client_payload.pr_number || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number) || (github.event_name == 'schedule' && 'membership-reconcile') || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: true

jobs:
  dispatch-issue-update:
    name: Dispatch affected PR Gates
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Dispatch affected PR Gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-gates.mjs

  gates:
    name: Evaluate PR Gates
    if: >-
      github.event_name != 'issues' &&
      github.event_name != 'schedule' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Mint Team membership token
        id: team-membership-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TEAM_MEMBERSHIP_APP_ID }}
          permission-members: read
          private-key: ${{ secrets.TEAM_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Mint Gate publisher token
        id: gate-publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TEAM_MEMBERSHIP_APP_ID }}
          permission-checks: write
          private-key: ${{ secrets.TEAM_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Evaluate Issue, readiness, and human validation gates
        if: always()
        env:
          GATE_CHECK_TOKEN: ${{ steps.gate-publisher-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_MEMBERSHIP_TOKEN: ${{ steps.team-membership-token.outputs.token }}
        run: node .github/scripts/pr-gates.mjs

  outcome:
    name: Publish terminal outcome
    needs: [dispatch-issue-update, gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ""
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: pr-gates
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: "${{ github.event_name == 'pull_request_target' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'repository_dispatch' && format('PR #{0}', github.event.client_payload.pr_number) || github.event_name == 'issue_comment' && github.event.issue.pull_request && format('PR #{0}', github.event.issue.number) || github.event_name == 'issue_comment' && format('Issue #{0}', github.event.issue.number) || github.event_name == 'issues' && format('Issue #{0}', github.event.issue.number) || 'reconcile' }}"
          SUMMARY_TARGET_URL: ${{ github.event_name == 'pull_request_target' && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.pull_request.number) || github.event_name == 'repository_dispatch' && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.client_payload.pr_number) || github.event_name == 'issue_comment' && github.event.issue.pull_request && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.issue.number) || github.event_name == 'issue_comment' && format('{0}/{1}/issues/{2}', github.server_url, github.repository, github.event.issue.number) || github.event_name == 'issues' && format('{0}/{1}/issues/{2}', github.server_url, github.repository, github.event.issue.number) || format('{0}/{1}', github.server_url, github.repository) }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: PR-Agent Connectivity Smoke

on:
  push:
    branches: [test/pr-agent-post-merge-smoke]

permissions: {}

jobs:
  probe:
    name: Probe PR-Agent provider
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe provider without logging secrets
        env:
          PR_AGENT_API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          PR_AGENT_API_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          PR_AGENT_MODEL: ${{ secrets.PR_AGENT_MODEL }}
        run: |
          node <<'NODE'
          const dns = require("node:dns").promises;

          async function main() {
            const base = new URL(process.env.PR_AGENT_API_BASE);
            const address = await dns.lookup(base.hostname);
            console.log(`dns=success family=${address.family}`);

            const pathname = `${base.pathname.replace(/\/$/, "")}/chat/completions`;
            const response = await fetch(new URL(pathname, base.origin), {
              method: "POST",
              headers: {
                authorization: `Bearer ${process.env.PR_AGENT_API_KEY}`,
                "content-type": "application/json",
              },
              body: JSON.stringify({
                model: process.env.PR_AGENT_MODEL.replace(/^openai\//, ""),
                messages: [{ role: "user", content: "Reply with OK." }],
                max_tokens: 8,
              }),
              signal: AbortSignal.timeout(45_000),
            });
            const contentType = response.headers.get("content-type") || "missing";
            console.log(`http_status=${response.status} content_type=${contentType.split(";")[0]}`);

            const payload = contentType.includes("application/json")
              ? await response.json()
              : null;
            console.log(
              `json=${payload !== null} choices=${Array.isArray(payload?.choices)} error=${Boolean(payload?.error)}`,
            );
            if (!response.ok || !Array.isArray(payload?.choices)) process.exitCode = 1;
          }

          main().catch((error) => {
            const cause = error?.cause;
            console.error(
              `probe=failure error=${error?.name || "unknown"} cause=${cause?.code || cause?.name || "unknown"}`,
            );
            process.exitCode = 1;
          });
          NODE

      - name: Probe provider from a Docker container
        env:
          PR_AGENT_API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          PR_AGENT_API_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          PR_AGENT_MODEL: ${{ secrets.PR_AGENT_MODEL }}
        run: |
          docker run --rm -i \
            -e PR_AGENT_API_BASE \
            -e PR_AGENT_API_KEY \
            -e PR_AGENT_MODEL \
            python:3.12-slim python - <<'PY'
          import json
          import os
          import socket
          import urllib.request
          from urllib.parse import urljoin, urlparse

          try:
              base = os.environ["PR_AGENT_API_BASE"].rstrip("/") + "/"
              host = urlparse(base).hostname
              families = {item[0] for item in socket.getaddrinfo(host, 443)}
              family = "/".join(
                  str(4 if item == socket.AF_INET else 6 if item == socket.AF_INET6 else item)
                  for item in sorted(families)
              )
              print(f"container_dns=success family={family}")

              body = json.dumps({
                  "model": os.environ["PR_AGENT_MODEL"].removeprefix("openai/"),
                  "messages": [{"role": "user", "content": "Reply with OK."}],
                  "max_tokens": 8,
              }).encode()
              request = urllib.request.Request(
                  urljoin(base, "chat/completions"),
                  data=body,
                  headers={
                      "Authorization": f"Bearer {os.environ['PR_AGENT_API_KEY']}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  content_type = response.headers.get_content_type()
                  payload = json.load(response) if content_type == "application/json" else None
                  print(f"container_http_status={response.status} content_type={content_type}")
                  print(
                      "container_json=" + str(payload is not None).lower()
                      + " choices=" + str(isinstance(payload.get("choices"), list)).lower()
                  )
                  if not isinstance(payload.get("choices"), list):
                      raise SystemExit(1)
          except BaseException as error:
              cause = error.__cause__ or error.__context__
              cause_name = type(cause).__name__ if cause else "unknown"
              print(f"container_probe=failure error={type(error).__name__} cause={cause_name}")
              raise SystemExit(1)
          PY

name: Publish container images
run-name: >-
  ${{ format('{0} | publish-ghcr | push', github.ref_name) }}

on:
  push:
    tags:
      - "connection-v*"
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  upgrade-validation:
    name: Validate existing Connection upgrades
    if: startsWith(github.ref_name, 'connection-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: connection_upgrade_test
          POSTGRES_USER: connection_test
          POSTGRES_PASSWORD: connection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connection_test -d connection_upgrade_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify actual runtime catalog snapshot
        run: node packages/openconnector-adapter/scripts/provider-release-snapshot.mjs
      - name: Verify canonical Connection release and upgrade paths
        shell: bash
        run: |
          baseline=""
          while IFS= read -r tag; do
            if [[ "$tag" != "$GITHUB_REF_NAME" ]]; then
              baseline="$tag"
              break
            fi
          done < <(git tag --merged HEAD --list 'connection-v*' --sort=-version:refname)
          test -n "$baseline"
          node .github/scripts/connection-release-guard.mjs --baseline "$baseline" | tee connection-catalog-diff.txt
          cat connection-catalog-diff.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Run existing-account upgrade regression
        env:
          CONNECTION_RECONNECT_TEST_DATABASE_URL: postgres://connection_test:connection_test@127.0.0.1:5432/connection_upgrade_test
        run: >-
          pnpm --filter @agent-infra/connection-store exec vitest run
          src/approval-upgrade.integration.test.ts
          src/approval-reconnect.integration.test.ts --no-file-parallelism

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: [upgrade-validation]
    if: >-
      always() &&
      (needs.upgrade-validation.result == 'success' ||
       (!startsWith(github.ref_name, 'connection-v') && needs.upgrade-validation.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: connection-api
            dockerfile: apps/connection-api/Dockerfile
          - name: connection-web
            dockerfile: apps/connection-web/Dockerfile
          - name: platform-api
            dockerfile: apps/platform-api/Dockerfile
          - name: platform-worker
            dockerfile: apps/platform-worker/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/agoraio-extensions/agent-infra/${{ matrix.name }}:${{ github.ref_name }}

      - name: Record exact Connection build subject
        if: startsWith(github.ref_name, 'connection-v') && (matrix.name == 'connection-api' || matrix.name == 'connection-web')
        env:
          SUBJECT_APPLICATION: ${{ matrix.name }}
          SUBJECT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p connection-subjects
          node deploy/connection-supply-chain.mjs subject "$SUBJECT_APPLICATION" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$SUBJECT_DIGEST" > "connection-subjects/$SUBJECT_APPLICATION.json"

      - name: Save Connection build subject
        if: startsWith(github.ref_name, 'connection-v') && (matrix.name == 'connection-api' || matrix.name == 'connection-web')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connection-subject-${{ matrix.name }}
          path: connection-subjects/${{ matrix.name }}.json
          if-no-files-found: error

  connection-evidence:
    name: Sign and verify ${{ matrix.name }}
    needs: [publish]
    if: startsWith(github.ref_name, 'connection-v') && github.repository_id == '1316991471' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: [connection-api, connection-web]
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch exact build subject
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: connection-subject-${{ matrix.name }}
          path: connection-subjects
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install pinned signing and scanning tools
        run: |
          mkdir -p "$RUNNER_TEMP/connection-tools"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/sigstore/cosign/releases/download/v3.0.2/cosign-linux-amd64 -o "$RUNNER_TEMP/connection-tools/cosign"
          echo "46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd  $RUNNER_TEMP/connection-tools/cosign" | sha256sum --check
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/anchore/syft/releases/download/v1.38.0/syft_1.38.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/connection-tools/syft.tar.gz"
          echo "bc664debb00db1b9b4b9dae4ba1a29d99621e33b641b94b78b9048374b812a3d  $RUNNER_TEMP/connection-tools/syft.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/connection-tools/syft.tar.gz" -C "$RUNNER_TEMP/connection-tools" syft
          chmod +x "$RUNNER_TEMP/connection-tools/cosign"
          echo "$RUNNER_TEMP/connection-tools" >> "$GITHUB_PATH"
      - name: Sign and independently verify release evidence
        env:
          SUBJECT_APPLICATION: ${{ matrix.name }}
        run: bash deploy/sign-connection-release.sh "$SUBJECT_APPLICATION" "connection-subjects/$SUBJECT_APPLICATION.json"
      - name: Preserve signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connection-signed-${{ matrix.name }}
          path: |
            build-evidence/signed/${{ matrix.name }}/manifest.json
            build-evidence/signed/${{ matrix.name }}/sbom.cdx.json
            build-evidence/signed/${{ matrix.name }}/manifest.sigstore.json
            build-evidence/signed/${{ matrix.name }}/sbom.sigstore.json
            build-evidence/signed/${{ matrix.name }}/evidence.json
          if-no-files-found: error

  outcome:
    name: Publish terminal outcome
    needs: [upgrade-validation, publish, connection-evidence]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ""
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ github.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: publish-ghcr
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: "Tag ${{ github.ref_name }}"
          SUMMARY_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Mirror images
run-name: >-
  ${{ github.event_name }} | mirror-images | main |
  ${{ github.event.workflow_run.id || inputs.publish_run_id || 'references' }}
on:
  workflow_run:
    workflows: [Publish images]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful Publish images run ID to mirror again
        required: false
        type: string
      publish_attempt:
        description: Exact successful attempt of that run
        required: false
        type: string
      references:
        description: Backfill instead of a run; GHCR agent-infra references pinned by digest, separated by spaces or commas
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mirror-images
  cancel-in-progress: false
jobs:
  mirror:
    if: >-
      github.repository == 'AgoraIO-Extensions/agent-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: agent-infra-mirror
    timeout-minutes: 90
    environment: internal-registry-mirror
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Download trusted mirror code
        env:
          EXECUTOR_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'echo MIRROR_SOURCE_DOWNLOAD_FAILED >&2' ERR
          [[ "$EXECUTOR_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          archive="$RUNNER_TEMP/executor.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
            "https://codeload.github.com/AgoraIO-Extensions/agent-infra/tar.gz/$EXECUTOR_SOURCE_SHA" --output "$archive"
          metadata="$RUNNER_TEMP/executor-commit.json"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --connect-timeout 10 --max-time 20 --retry 3 --retry-all-errors \
            "https://api.github.com/repos/AgoraIO-Extensions/agent-infra/git/commits/$EXECUTOR_SOURCE_SHA" --output "$metadata"
          expected_tree=$(/home/runner/externals/node24/bin/node -e '
            const m=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));
            if(m.sha!==process.env.EXECUTOR_SOURCE_SHA||!/^[a-f0-9]{40}$/.test(m.tree?.sha??""))throw new Error("EXECUTOR_SOURCE_COMMIT_MISMATCH");
            process.stdout.write(m.tree.sha);' "$metadata")
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" -c core.autocrlf=false -c core.filemode=true add --force --all
          if [[ "$(git -C "$GITHUB_WORKSPACE" write-tree)" != "$expected_tree" ]]; then
            echo "EXECUTOR_SOURCE_TREE_MISMATCH" >&2
            exit 1
          fi
          runner_node=/home/runner/externals/node24/bin
          "$runner_node/node" -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1)'
          echo "$runner_node" >> "$GITHUB_PATH"
      - name: Install mirror tools
        run: bash .github/scripts/install-mirror-tools.sh
      - name: Plan manifests from the exact publication
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
          PUBLISH_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.publish_attempt }}
          MIRROR_REFERENCES: ${{ inputs.references }}
        run: node deploy/release/image-mirror.ts plan "$RUNNER_TEMP/mirror-plan.json"
      - name: Copy manifests to the internal registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          MIRROR_REPOSITORY_PREFIX: ${{ secrets.MIRROR_REPOSITORY_PREFIX }}
          MIRROR_REGISTRY_USERNAME: ${{ secrets.MIRROR_REGISTRY_USERNAME }}
          MIRROR_REGISTRY_PASSWORD: ${{ secrets.MIRROR_REGISTRY_PASSWORD }}
          MIRROR_SOURCE_PREFIXES: ${{ secrets.MIRROR_SOURCE_PREFIXES }}
        run: node deploy/release/image-mirror.ts copy "$RUNNER_TEMP/mirror-plan.json" "$RUNNER_TEMP/mirror-receipt.json"
      - name: Upload mirror receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: mirror-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mirror-receipt.json
          if-no-files-found: ignore

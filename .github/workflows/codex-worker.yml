name: Codex Worker
run-name: >-
  ${{
    github.event_name == 'issues' &&
    format('Issue #{0} | codex-worker | {1}', github.event.issue.number, github.event.action) ||
    github.event_name == 'pull_request_target' &&
    format('PR #{0} | codex-worker | {1}', github.event.pull_request.number, github.event.action) ||
    github.event_name == 'repository_dispatch' &&
    format('Issue #{0} | codex-worker | repository_dispatch', github.event.client_payload.issue_number) ||
    github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number &&
    format('PR #{0} | codex-worker | source {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.id) ||
    github.event_name == 'workflow_run' &&
    format('main | codex-worker | source {0}', github.event.workflow_run.id) ||
    'main | codex-worker | push'
  }}

on:
  push:
    branches: [main]
  issues:
    types: [closed, edited, reopened, labeled, unlabeled]
  pull_request_target:
    types: [closed]
  repository_dispatch:
    types: [codex-worker]
  workflow_run:
    workflows: [Docs CI, Claude PR Review]
    types: [completed]

permissions: {}

concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      format('codex-worker-ignored-pr-{0}', github.event.pull_request.number) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'Claude PR Review' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        format('codex-worker-review-recovery-{0}', github.repository)) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'Claude PR Review' &&
        format('codex-worker-ignored-review-recovery-{0}', github.run_id)) ||
      format(
        'codex-worker-{0}',
        github.event.workflow_run.head_branch ||
        github.event.pull_request.head.ref ||
        format(
          'codex/issue-{0}',
          github.event.issue.number || github.event.client_payload.issue_number
        )
      )
    }}
  cancel-in-progress: >-
    ${{
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.merged) ||
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'issues' && github.event.action == 'unlabeled' && github.event.label.name == 'ready-for-agent') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready-for-human') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'needs-triage') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'wontfix') ||
      (github.event_name == 'repository_dispatch' &&
        (github.event.client_payload.operation == 'pause' ||
          github.event.client_payload.operation == 'triage'))
    }}

jobs:
  base-update:
    name: Update Worker PRs from default branch
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Update clean Worker PR branches
        env:
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKER_DEFAULT_SHA: ${{ github.sha }}
        run: node trusted/.github/scripts/codex-worker.mjs update-bases

  authorization:
    name: Record Worker authorization
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.author_association == 'MEMBER' ||
      github.event.issue.author_association == 'OWNER' ||
      github.event.issue.author_association == 'COLLABORATOR'
    concurrency:
      group: worker-authorization-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Mint Team membership token
        id: team-membership-token
        if: >-
          github.event_name == 'issues' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'ready-for-agent'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TEAM_MEMBERSHIP_APP_ID }}
          permission-members: read
          private-key: ${{ secrets.TEAM_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Record trusted authorization transition
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_MEMBERSHIP_TOKEN: ${{ steps.team-membership-token.outputs.token }}
        run: node trusted/.github/scripts/codex-worker.mjs authorize

  prepare:
    name: Prepare Worker attempt
    needs: authorization
    if: >-
      always() &&
      needs.authorization.result == 'success' &&
      needs.authorization.outputs.allowed != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      operation: ${{ steps.prepare.outputs.operation }}
      reason: ${{ steps.prepare.outputs.reason }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      start_sha: ${{ steps.prepare.outputs.start_sha }}
      default_branch: ${{ steps.prepare.outputs.default_branch }}
      attempt: ${{ steps.prepare.outputs.attempt }}
      model_slot: ${{ steps.prepare.outputs.model_slot }}
      worker_run_id: ${{ steps.prepare.outputs.worker_run_id }}
      checkpoint_run_id: ${{ steps.prepare.outputs.checkpoint_run_id }}
      checkpoint_artifact_name: ${{ steps.prepare.outputs.checkpoint_artifact_name }}
      pull_request_number: ${{ steps.prepare.outputs.pull_request_number }}
      source_run_id: ${{ steps.prepare.outputs.source_run_id }}
      failure_fingerprint: ${{ steps.prepare.outputs.failure_fingerprint }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve trusted Review recovery target
        id: resolve-review-recovery
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Claude PR Review' &&
          github.event.workflow_run.conclusion == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/.github/scripts/codex-worker.mjs resolve-review-recovery

      - name: Download trusted Review recovery target
        if: >-
          steps.resolve-review-recovery.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-review-recovery-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/claude-review-recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare trusted Worker plan
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_RESPONSES_API_ENDPOINT: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
          CODEX_EFFORT: ${{ vars.CODEX_EFFORT }}
          CODEX_WORKER_TIMEOUT_MINUTES: ${{ vars.CODEX_WORKER_TIMEOUT_MINUTES || '60' }}
          WORKER_PREPARE_DIR: ${{ runner.temp }}/codex-worker-prepare
          WORKER_REVIEW_RECOVERY_AVAILABLE: ${{ steps.resolve-review-recovery.outputs.available }}
          WORKER_REVIEW_RECOVERY_PATH: ${{ runner.temp }}/claude-review-recovery/claude-review-recovery.json
        run: node trusted/.github/scripts/codex-worker.mjs prepare

      - name: Stage trusted Worker schema
        if: steps.prepare.outputs.operation == 'implement'
        env:
          WORKER_PREPARE_DIR: ${{ runner.temp }}/codex-worker-prepare
        run: >-
          install -m 0444 trusted/.github/codex-worker-result.schema.json
          "$WORKER_PREPARE_DIR/result.schema.json"

      - name: Upload trusted Worker plan
        if: steps.prepare.outputs.operation == 'implement'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-worker-plan-${{ steps.prepare.outputs.worker_run_id }}-attempt-${{ steps.prepare.outputs.attempt }}
          path: |
            ${{ runner.temp }}/codex-worker-prepare/plan.json
            ${{ runner.temp }}/codex-worker-prepare/prompt.md
            ${{ runner.temp }}/codex-worker-prepare/result.schema.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  implement:
    name: Run Worker model attempt
    needs: prepare
    if: needs.prepare.outputs.operation == 'implement'
    concurrency:
      group: codex-worker-model-slot-${{ needs.prepare.outputs.model_slot }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.CODEX_WORKER_TIMEOUT_MINUTES || '60') }}
    permissions:
      actions: read
      contents: read
    outputs:
      model_outcome: ${{ steps.codex.outcome }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Checkout recorded start commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.start_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download trusted Worker plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-worker-plan-${{ needs.prepare.outputs.worker_run_id }}-attempt-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/codex-worker-plan

      - name: Download previous trusted checkpoint
        if: needs.prepare.outputs.checkpoint_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.checkpoint_artifact_name }}
          path: ${{ runner.temp }}/codex-worker-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.checkpoint_run_id }}

      - name: Apply previous trusted checkpoint
        if: needs.prepare.outputs.checkpoint_run_id != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKER_CHECKPOINT_PATCH_PATH: ${{ runner.temp }}/codex-worker-checkpoint/change.patch
          WORKER_CHECKPOINT_PATH: ${{ runner.temp }}/codex-worker-checkpoint/checkpoint.json
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_PLAN_PATH: ${{ runner.temp }}/codex-worker-plan/plan.json
          WORKER_START_SHA: ${{ needs.prepare.outputs.start_sha }}
          WORKER_WORKSPACE: ${{ github.workspace }}/workspace
        run: node trusted/.github/scripts/codex-worker.mjs resume

      - name: Stage trusted Worker inputs
        env:
          WORKER_PREPARE_DIR: ${{ runner.temp }}/codex-worker-plan
          WORKER_ARTIFACT_DIR: ${{ github.workspace }}/workspace/.codex-worker-artifact
          CODEX_HOME: ${{ runner.temp }}/codex-home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKER_ARTIFACT_DIR/output"
          : > "$WORKER_ARTIFACT_DIR/output/change.patch"
          install -m 0444 "$WORKER_PREPARE_DIR/plan.json" "$WORKER_ARTIFACT_DIR/plan.json"
          install -m 0444 "$WORKER_PREPARE_DIR/prompt.md" "$WORKER_ARTIFACT_DIR/prompt.md"
          install -m 0444 "$WORKER_PREPARE_DIR/result.schema.json" \
            "$WORKER_ARTIFACT_DIR/result.schema.json"
          cp -R trusted/.codex "$CODEX_HOME"

      - name: Run Codex implementation
        id: codex
        continue-on-error: true
        uses: openai/codex-action@dd78cb653811af44014baa08fe954e28d32c1bf9
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          prompt-file: ${{ github.workspace }}/workspace/.codex-worker-artifact/prompt.md
          output-file: ${{ github.workspace }}/workspace/.codex-worker-artifact/output/result.json
          output-schema-file: ${{ github.workspace }}/workspace/.codex-worker-artifact/result.schema.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: github-worker
          codex-version: 0.146.0
          model: ${{ secrets.CODEX_MODEL }}
          effort: ${{ vars.CODEX_EFFORT }}
          safety-strategy: drop-sudo

      - name: Upload fixed Worker Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-worker-output-${{ needs.prepare.outputs.worker_run_id }}-attempt-${{ needs.prepare.outputs.attempt }}
          path: |
            ${{ github.workspace }}/workspace/.codex-worker-artifact/output/change.patch
            ${{ github.workspace }}/workspace/.codex-worker-artifact/output/result.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Validate and publish Worker result
    needs: [prepare, implement]
    if: always() && needs.prepare.outputs.operation != '' && needs.prepare.outputs.operation != 'noop'
    concurrency:
      group: blocker-graph-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Handle Worker control event
        if: >-
          needs.prepare.outputs.operation != 'implement' &&
          needs.prepare.outputs.operation != 'retry_ci'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_OPERATION: ${{ needs.prepare.outputs.operation }}
          WORKER_REASON: ${{ needs.prepare.outputs.reason }}
        run: node trusted/.github/scripts/codex-worker.mjs handle

      - name: Retry failed CI without code changes
        if: needs.prepare.outputs.operation == 'retry_ci'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_FAILURE_FINGERPRINT: ${{ needs.prepare.outputs.failure_fingerprint }}
          WORKER_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_PULL_REQUEST_NUMBER: ${{ needs.prepare.outputs.pull_request_number }}
          WORKER_SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
        run: node trusted/.github/scripts/codex-worker.mjs retry-ci

      - name: Download trusted Worker plan
        if: needs.prepare.outputs.operation == 'implement'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-worker-plan-${{ needs.prepare.outputs.worker_run_id }}-attempt-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/codex-worker-plan

      - name: Download fixed Worker Artifact
        id: download-output
        if: needs.prepare.outputs.operation == 'implement'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-worker-output-${{ needs.prepare.outputs.worker_run_id }}-attempt-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/codex-worker-output

      - name: Checkout recorded start commit
        if: needs.prepare.outputs.operation == 'implement'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.start_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Stage recoverable empty Artifact
        if: needs.prepare.outputs.operation == 'implement'
        env:
          WORKER_OUTPUT_DIR: ${{ runner.temp }}/codex-worker-output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORKER_OUTPUT_DIR"
          if [[ ! -f "$WORKER_OUTPUT_DIR/change.patch" ]]; then
            : > "$WORKER_OUTPUT_DIR/change.patch"
          fi

      - name: Validate Artifact before publisher credential exposure
        id: preflight
        if: needs.prepare.outputs.operation == 'implement'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_CHECKPOINT_DIR: ${{ runner.temp }}/trusted-checkpoint
          WORKER_ERROR_CLASSIFICATION: ${{ needs.implement.result == 'success' && 'action' || 'runner' }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_MODEL_OUTCOME: ${{ needs.implement.outputs.model_outcome || needs.implement.result }}
          WORKER_START_SHA: ${{ needs.prepare.outputs.start_sha }}
          WORKER_DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          WORKER_PLAN_PATH: ${{ runner.temp }}/codex-worker-plan/plan.json
          WORKER_PATCH_PATH: ${{ runner.temp }}/codex-worker-output/change.patch
          WORKER_RESULT_PATH: ${{ runner.temp }}/codex-worker-output/result.json
          WORKER_WORKSPACE: ${{ github.workspace }}/workspace
        run: node trusted/.github/scripts/codex-worker.mjs preflight

      - name: Upload trusted Patch checkpoint
        if: steps.preflight.outputs.checkpoint_created == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-worker-checkpoint-${{ needs.prepare.outputs.worker_run_id }}-attempt-${{ needs.prepare.outputs.attempt }}
          path: |
            ${{ runner.temp }}/trusted-checkpoint/change.patch
            ${{ runner.temp }}/trusted-checkpoint/checkpoint.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Record Worker attempt outcome
        if: steps.preflight.outputs.attempt_outcome != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ATTEMPT_OUTCOME: ${{ steps.preflight.outputs.attempt_outcome }}
          WORKER_CHECKPOINT_PATH: ${{ runner.temp }}/trusted-checkpoint/checkpoint.json
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_PLAN_PATH: ${{ runner.temp }}/codex-worker-plan/plan.json
          WORKER_REMAINING_AC: ${{ steps.preflight.outputs.remaining_ac }}
          WORKER_START_SHA: ${{ needs.prepare.outputs.start_sha }}
          WORKER_TERMINATION_REASON: ${{ steps.preflight.outputs.termination_reason }}
        run: node trusted/.github/scripts/codex-worker.mjs finalize-attempt

      - name: Dispatch next model attempt
        if: steps.preflight.outputs.operation == 'retry'
        env:
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_PLAN_PATH: ${{ runner.temp }}/codex-worker-plan/plan.json
          WORKER_START_SHA: ${{ needs.prepare.outputs.start_sha }}
        run: node trusted/.github/scripts/codex-worker.mjs dispatch-retry

      - name: Handle terminal attempt failure
        if: steps.preflight.outputs.operation == 'triage'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_OPERATION: triage
          WORKER_REASON: ${{ steps.preflight.outputs.reason }}
        shell: bash
        run: |
          node trusted/.github/scripts/codex-worker.mjs handle
          exit 1

      - name: Publish fixed branch and Draft PR
        id: publish
        if: >-
          steps.preflight.outputs.valid == 'true' &&
          steps.preflight.outputs.operation == 'publish'
        continue-on-error: true
        env:
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_START_SHA: ${{ needs.prepare.outputs.start_sha }}
          WORKER_DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          WORKER_COMMIT_SHA: ${{ steps.preflight.outputs.commit_sha }}
          WORKER_PLAN_PATH: ${{ runner.temp }}/codex-worker-plan/plan.json
          WORKER_RESULT_PATH: ${{ runner.temp }}/codex-worker-output/result.json
          WORKER_WORKSPACE: ${{ github.workspace }}/workspace
        run: node trusted/.github/scripts/codex-worker.mjs publish

      - name: Publish unprivileged blocker proposals
        id: blockers
        if: >-
          steps.preflight.outputs.valid == 'true' &&
          steps.preflight.outputs.operation == 'block'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_START_SHA: ${{ needs.prepare.outputs.start_sha }}
          WORKER_DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          WORKER_PLAN_PATH: ${{ runner.temp }}/codex-worker-plan/plan.json
          WORKER_RESULT_PATH: ${{ runner.temp }}/codex-worker-output/result.json
        run: node trusted/.github/scripts/codex-worker.mjs blockers

      - name: Publish human handoff
        id: handoff
        if: >-
          steps.preflight.outputs.valid == 'true' &&
          steps.preflight.outputs.operation == 'handoff'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_START_SHA: ${{ needs.prepare.outputs.start_sha }}
          WORKER_DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          WORKER_PLAN_PATH: ${{ runner.temp }}/codex-worker-plan/plan.json
          WORKER_RESULT_PATH: ${{ runner.temp }}/codex-worker-output/result.json
        run: node trusted/.github/scripts/codex-worker.mjs handoffs

      - name: Escalate publisher failure
        if: >-
          steps.publish.outcome == 'failure' ||
          steps.blockers.outcome == 'failure' ||
          steps.handoff.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKER_ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          WORKER_OPERATION: triage
          WORKER_REASON: >-
            ${{
              steps.blockers.outcome == 'failure' && 'blocker-publish-failed' ||
              steps.handoff.outcome == 'failure' && 'handoff-publish-failed' ||
              'publish-failed'
            }}
        shell: bash
        run: |
          node trusted/.github/scripts/codex-worker.mjs handle
          exit 1

  outcome:
    name: Publish terminal outcome
    needs: [base-update, authorization, prepare, implement, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ needs.prepare.outputs.head_sha || needs.prepare.outputs.start_sha || github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: codex-worker
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: "${{ github.event_name == 'issues' && format('Issue #{0}', github.event.issue.number) || github.event_name == 'pull_request_target' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'repository_dispatch' && format('Issue #{0}', github.event.client_payload.issue_number) || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || 'main' }}"
          SUMMARY_TARGET_URL: ${{ github.event_name == 'issues' && format('{0}/{1}/issues/{2}', github.server_url, github.repository, github.event.issue.number) || github.event_name == 'pull_request_target' && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.pull_request.number) || github.event_name == 'repository_dispatch' && format('{0}/{1}/issues/{2}', github.server_url, github.repository, github.event.client_payload.issue_number) || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.workflow_run.pull_requests[0].number) || format('{0}/{1}/tree/{2}', github.server_url, github.repository, github.event.repository.default_branch) }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

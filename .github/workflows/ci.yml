name: CI
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('PR #{0} | ci | pull_request', github.event.pull_request.number) ||
    'main | ci | push'
  }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      SCAN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TRIVY_TOOL_DIR: .trivy-tool
      DOCKER_DEFAULT_PLATFORM: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Check TypeScript
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Read the pinned native candidate source
        id: codex_candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const release = JSON.parse(readFileSync('packages/agent-runtime/src/codex-release.json', 'utf8'));
          assert.equal(release.schemaVersion, 2);
          assert.equal(release.distribution?.kind, 'derived');
          const artifact = release.artifacts.arm64;
          assert.equal(artifact.target, 'aarch64-unknown-linux-musl');
          const transport = artifact.transport;
          assert.equal(transport.kind, 'github-actions');
          assert.equal(transport.repository, 'AgoraIO-Extensions/agent-infra');
          assert.match(transport.sourceHead, /^[a-f0-9]{40}$/);
          for (const key of ['runId', 'runAttempt', 'artifactId'])
            assert.ok(Number.isSafeInteger(transport[key]) && transport[key] > 0);
          const metadata = async (path) => {
            const response = await fetch(`https://api.github.com/repos/${transport.repository}/${path}`, {
              headers: {authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json'},
              signal: AbortSignal.timeout(30_000),
            });
            assert.ok(response.ok, 'Pinned native source metadata unavailable');
            return response.json();
          };
          const [run, asset] = await Promise.all([
            metadata(`actions/runs/${transport.runId}/attempts/${transport.runAttempt}`),
            metadata(`actions/artifacts/${transport.artifactId}`),
          ]);
          assert.equal(run.path, '.github/workflows/codex-native-candidate.yml');
          assert.equal(run.head_sha, transport.sourceHead);
          assert.equal(run.run_attempt, transport.runAttempt);
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.equal(asset.id, transport.artifactId);
          assert.equal(asset.workflow_run.id, transport.runId);
          assert.equal(asset.workflow_run.head_sha, transport.sourceHead);
          assert.equal(asset.name, `codex-candidate-${transport.sourceHead}-${artifact.target}`);
          assert.equal(asset.expired, false);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `run-id=${transport.runId}\nartifact-id=${transport.artifactId}\nrepository=${transport.repository}\n`);
          appendFileSync(process.env.GITHUB_ENV,
            `AGENT_INFRA_CODEX_BUILD_CONTEXT=${join(process.env.RUNNER_TEMP, 'codex-native')}\n`);
          NODE

      - name: Download the pinned complete native candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.codex_candidate.outputs.artifact-id }}
          run-id: ${{ steps.codex_candidate.outputs.run-id }}
          repository: ${{ steps.codex_candidate.outputs.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/codex-native

      - name: Build pinned Codex native test environment
        run: >-
          docker build --platform linux/arm64 --target builder
          --build-context "codex-native=$AGENT_INFRA_CODEX_BUILD_CONTEXT"
          -f apps/agent-runtime-host/Dockerfile
          --tag agent-infra-codex-native-test .

      - name: Verify native Codex recovery
        run: |
          docker run --rm --pull=never --network=none --read-only \
            --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,exec,size=256m,mode=1777 \
            --env AGENT_INFRA_CODEX_NATIVE_TEST=1 \
            --env PATH=/opt/codex/bin:/usr/local/bin:/usr/bin:/bin \
            agent-infra-codex-native-test \
            pnpm --filter @agent-infra/agent-runtime exec vitest run \
            src/codex-native-recovery.test.ts --cache=false

      - name: Verify native Claude conformance in the pinned Linux image
        run: |
          docker run --rm --pull=never --network=none --read-only \
            --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,exec,size=256m,mode=1777 \
            agent-infra-codex-native-test \
            pnpm --filter @agent-infra/agent-runtime exec vitest run \
            src/claude-native.test.ts src/claude-runtime-driver.test.ts \
            src/runtime-driver-conformance.test.ts --cache=false

      - name: Verify Generic ACP and OpenCode conformance in the pinned Linux image
        run: |
          docker run --init --rm --pull=never --network=none --read-only \
            --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,exec,size=512m,mode=1777 \
            --env OPENCODE_EXECUTABLE=/opt/opencode/bin/opencode \
            agent-infra-codex-native-test \
            pnpm --filter @agent-infra/agent-runtime exec vitest run \
            src/acp-runtime-driver.test.ts src/acp-session.test.ts \
            src/opencode-native.test.ts src/runtime-driver-conformance.test.ts --maxWorkers=1 --cache=false

      - name: Build applications
        run: pnpm build

      - name: Smoke test applications
        run: pnpm smoke

      - name: Install browser for Web validation
        run: pnpm --filter @agent-infra/web exec playwright install --with-deps chromium

      - name: Validate Web management journeys
        run: pnpm --filter @agent-infra/web test:browser

      - name: Upload Web browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-management-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build deployment images
        id: images
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/vulnerability-scan.mjs build

      - name: Probe native Codex runtime image
        id: runtime_probe
        run: >-
          node deploy/release/runtime-probe.mjs --scan-build
          .vulnerability-scan/build.json "$RUNNER_TEMP/codex-runtime-probe.json"

      - name: Preserve Codex runtime image evidence
        if: ${{ !cancelled() && steps.runtime_probe.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-runtime-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/codex-runtime-probe.json
          if-no-files-found: error
          retention-days: 14

      - name: Lint Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          README.md AGENTS.md ".github/**/*.md" "docs/**/*.md"

      - name: Check Markdown links
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            npx --yes markdown-link-check@3.15.0 \
              --config .markdown-link-check.json "$file"
          done < <(find README.md AGENTS.md .github docs -type f -name '*.md' -print0)

      - name: Verify workflow policy
        run: node .github/scripts/verify-workflow-policy.mjs

      - name: Lint workflows
        run: .github/scripts/run-actionlint.sh

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            git show --check --format=fuller "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Install verified vulnerability scanner
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: node .github/scripts/install-trivy.mjs "$TRIVY_TOOL_DIR"

      - name: Scan dependencies and built images
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULNERABILITY_EXCEPTIONS: ${{ vars.VULNERABILITY_EXCEPTIONS }}
        run: node .github/scripts/vulnerability-scan.mjs scan

      - name: Upload vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vulnerability-scan/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Download vulnerability evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vulnerability-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vulnerability-readback

      - name: Verify downloaded evidence and enforce policy
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULNERABILITY_EXCEPTIONS: ${{ vars.VULNERABILITY_EXCEPTIONS }}
          VULNERABILITY_REPORT_DIR: ${{ runner.temp }}/vulnerability-readback
        run: node .github/scripts/vulnerability-scan.mjs verify

  workload-kind:
    name: Workload kind
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install tools and dependencies
        run: |
          npm install --global pnpm@11.20.0
          go install sigs.k8s.io/kind@v0.30.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile
      - name: Build Workload dependencies
        run: pnpm exec turbo run build --filter=@agent-infra/platform-worker
      - name: Verify Kubernetes lifecycle and isolation
        run: bash deploy/kind/workload.sh

  outcome:
    name: Publish terminal outcome
    needs: [ci, workload-kind]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ""
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: ci
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main' }}"
          SUMMARY_TARGET_URL: ${{ github.event_name == 'pull_request' && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.pull_request.number) || format('{0}/{1}/tree/{2}', github.server_url, github.repository, github.event.repository.default_branch) }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

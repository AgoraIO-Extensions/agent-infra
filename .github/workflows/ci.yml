name: CI
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('PR #{0} | ci | pull_request', github.event.pull_request.number) ||
    'main | ci | push'
  }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCAN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TRIVY_TOOL_DIR: .trivy-tool
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Check TypeScript
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Build pinned Codex native test environment
        run: >-
          docker build --target builder -f apps/agent-runtime-host/Dockerfile
          --tag agent-infra-codex-native-test .

      # TEMPORARY #404 diagnostic: the bridge drains native stderr by design, so
      # the reason a wrapped launch exits is invisible in the suite above. Remove
      # this step once the Linux Conversation boundary is verified.
      - name: Diagnose the native Conversation boundary
        continue-on-error: true
        run: |
          docker run --rm -i --pull=never --network=none --read-only \
            --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,exec,size=256m,mode=1777 \
            --env PATH=/opt/codex/bin:/usr/local/bin:/usr/bin:/bin \
            --entrypoint sh agent-infra-codex-native-test \
            -c 'cat > /tmp/probe.mjs && node /tmp/probe.mjs' <<'PROBE'
          import { spawn, spawnSync } from "node:child_process";
          import { existsSync, mkdirSync, mkdtempSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";

          const run = (cmd, args) => {
            const result = spawnSync(cmd, args, { encoding: "utf8" });
            return `status=${result.status} signal=${result.signal} err=${(result.stderr || "").trim()}`;
          };
          console.log("kernel:", run("uname", ["-rm"]));
          console.log("setpriv:", spawnSync("setpriv", ["--version"], { encoding: "utf8" }).stdout.trim());

          const rights = [
            "execute", "write-file", "read-file", "read-dir", "remove-dir",
            "remove-file", "make-char", "make-dir", "make-reg", "make-sock",
            "make-fifo", "make-block", "make-sym", "refer", "truncate",
          ].join(",");
          console.log("access-only:", run("setpriv", ["--no-new-privs", "--landlock-access", `fs:${rights}`, "--", "/bin/true"]));
          console.log("ioctl-only:", run("setpriv", ["--no-new-privs", "--landlock-access", "fs:ioctl-dev", "--", "/bin/true"]));

          const root = mkdtempSync(join(tmpdir(), "probe-"));
          const conversation = join(root, "conversations", "k");
          mkdirSync(join(conversation, "home"), { recursive: true, mode: 0o700 });
          mkdirSync(join(conversation, "workspace"), { recursive: true, mode: 0o700 });
          const home = mkdtempSync(join(tmpdir(), "probe-home-"));
          const rules = [];
          const allow = (access, path) => {
            if (existsSync(path)) rules.push("--landlock-rule", `path-beneath:${access}:${path}`);
          };
          const program = "execute,read-file,read-dir";
          for (const path of ["/opt/codex", "/opt/codex/bin", "/usr/local/bin", "/usr/bin", "/bin", "/sbin", "/usr", "/lib", "/lib64"]) allow(program, path);
          for (const path of ["/etc", "/proc", "/sys"]) allow("read-file,read-dir", path);
          for (const path of ["/dev", home, conversation]) allow(rights, path);
          console.log("rule-only:", run("setpriv", ["--no-new-privs", "--landlock-access", `fs:${rights}`, ...rules, "--", "/bin/true"]));

          const launch = [
            "app-server", "--stdio", "--strict-config",
            "--config", 'model="gpt-5.3-codex"',
            "--config", 'model_reasoning_effort="high"',
            "--config", "mcp_servers={}",
            "--config", "features.plugins=false",
            "--config", 'sandbox_mode="workspace-write"',
            "--config", "features.use_legacy_landlock=true",
          ];
          const environment = { HOME: home, CODEX_HOME: join(conversation, "home"), PATH: process.env.PATH, TMPDIR: home };
          const attempt = (label, command, args) => new Promise((resolve) => {
            const child = spawn(command, args, { stdio: ["pipe", "pipe", "pipe"], cwd: join(conversation, "workspace"), env: environment });
            let out = "";
            let err = "";
            child.stdout.on("data", (chunk) => { out += chunk; });
            child.stderr.on("data", (chunk) => { err += chunk; });
            child.on("error", (error) => { console.log(label, "spawn error", error.message); });
            child.stdin.write(`${JSON.stringify({ id: 1, method: "initialize", params: { clientInfo: { name: "probe", version: "1" }, capabilities: { experimentalApi: true } } })}\n`);
            setTimeout(() => { try { child.stdin.write(`${JSON.stringify({ id: 2, method: "thread/start", params: { historyMode: "paginated" } })}\n`); } catch {} }, 1500);
            child.on("close", (code, signal) => { console.log(label, "closed", code, signal); });
            setTimeout(() => {
              console.log(`=== ${label} stdout ===`);
              console.log(out.slice(0, 900));
              console.log(`=== ${label} stderr ===`);
              console.log(err.slice(0, 2500));
              child.kill("SIGKILL");
              resolve();
            }, 9000);
          });
          await attempt("direct", "/opt/codex/bin/codex", launch);
          await attempt("wrapped", "setpriv", ["--no-new-privs", "--landlock-access", `fs:${rights}`, ...rules, "--", "/opt/codex/bin/codex", ...launch]);
          process.exit(0);
          PROBE

      - name: Verify native Codex recovery
        run: |
          docker run --rm --pull=never --network=none --read-only \
            --user 1000:1000 --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,exec,size=256m,mode=1777 \
            --env AGENT_INFRA_CODEX_NATIVE_TEST=1 \
            --env PATH=/opt/codex/bin:/usr/local/bin:/usr/bin:/bin \
            agent-infra-codex-native-test \
            pnpm --filter @agent-infra/agent-runtime exec vitest run \
            src/codex-native-recovery.test.ts --cache=false

      - name: Build applications
        run: pnpm build

      - name: Smoke test applications
        run: pnpm smoke

      - name: Install browser for Web validation
        run: pnpm --filter @agent-infra/web exec playwright install --with-deps chromium

      - name: Validate Web management journeys
        run: pnpm --filter @agent-infra/web test:browser

      - name: Upload Web browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-management-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build deployment images
        id: images
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/vulnerability-scan.mjs build

      - name: Probe native Codex runtime image
        id: runtime_probe
        run: >-
          node deploy/release/runtime-probe.mjs --scan-build
          .vulnerability-scan/build.json "$RUNNER_TEMP/codex-runtime-probe.json"

      - name: Preserve Codex runtime image evidence
        if: ${{ !cancelled() && steps.runtime_probe.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-runtime-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/codex-runtime-probe.json
          if-no-files-found: error
          retention-days: 14

      - name: Lint Markdown
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          README.md AGENTS.md ".github/**/*.md" "docs/**/*.md"

      - name: Check Markdown links
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            npx --yes markdown-link-check@3.15.0 \
              --config .markdown-link-check.json "$file"
          done < <(find README.md AGENTS.md .github docs -type f -name '*.md' -print0)

      - name: Verify workflow policy
        run: node .github/scripts/verify-workflow-policy.mjs

      - name: Lint workflows
        run: .github/scripts/run-actionlint.sh

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            git show --check --format=fuller "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Install verified vulnerability scanner
        run: node .github/scripts/install-trivy.mjs "$TRIVY_TOOL_DIR"

      - name: Scan dependencies and built images
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULNERABILITY_EXCEPTIONS: ${{ vars.VULNERABILITY_EXCEPTIONS }}
        run: node .github/scripts/vulnerability-scan.mjs scan

      - name: Upload vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vulnerability-scan/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Download vulnerability evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vulnerability-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vulnerability-readback

      - name: Verify downloaded evidence and enforce policy
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULNERABILITY_EXCEPTIONS: ${{ vars.VULNERABILITY_EXCEPTIONS }}
          VULNERABILITY_REPORT_DIR: ${{ runner.temp }}/vulnerability-readback
        run: node .github/scripts/vulnerability-scan.mjs verify

  workload-kind:
    name: Workload kind
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install tools and dependencies
        run: |
          npm install --global pnpm@11.20.0
          go install sigs.k8s.io/kind@v0.30.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile
      - name: Build Workload dependencies
        run: pnpm exec turbo run build --filter=@agent-infra/platform-worker
      - name: Verify Kubernetes lifecycle and isolation
        run: bash deploy/kind/workload.sh

  outcome:
    name: Publish terminal outcome
    needs: [ci, workload-kind]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Publish terminal Job Summary
        env:
          SUMMARY_ACTION: ${{ github.event.action || github.event_name }}
          SUMMARY_ATTEMPT: ""
          SUMMARY_CYCLE: ""
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUMMARY_NEXT_OWNER: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'repository-maintainer' || 'none' }}
          SUMMARY_OPERATION: ci
          SUMMARY_OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
          SUMMARY_TARGET: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main' }}"
          SUMMARY_TARGET_URL: ${{ github.event_name == 'pull_request' && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.pull_request.number) || format('{0}/{1}/tree/{2}', github.server_url, github.repository, github.event.repository.default_branch) }}
        shell: bash
        run: |
          {
            echo "## Workflow terminal outcome"
            echo
            echo "- Target: [$SUMMARY_TARGET]($SUMMARY_TARGET_URL)"
            echo "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Operation: \`$SUMMARY_OPERATION\`"
            echo "- Event/action: \`$SUMMARY_EVENT\` / \`$SUMMARY_ACTION\`"
            echo "- Head SHA: \`$SUMMARY_HEAD_SHA\`"
            echo "- Cycle: ${SUMMARY_CYCLE:-N/A}"
            echo "- Attempt: ${SUMMARY_ATTEMPT:-N/A}"
            echo "- Terminal outcome: \`$SUMMARY_OUTCOME\`"
            echo "- Next owner: \`$SUMMARY_NEXT_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

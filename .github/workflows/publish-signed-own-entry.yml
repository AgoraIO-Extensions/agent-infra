name: Publish signed own entry
run-name: >-
  ${{ github.event_name }} | publish-signed-own-entry | ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged 40-hex commit to publish
        required: true
        type: string
      promote_existing:
        description: Promote the verified fixture from this workflow to the admitted repository
        required: false
        type: boolean
        default: false
      origin_run_id:
        description: Successful earlier publish-signed-own-entry run that produced the source receipt
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY_PREFIX: ghcr.io/agoraio-extensions/agent-infra
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  IMAGE_TAG: ${{ format('release-{0}', inputs.source_sha) }}

jobs:
  own-entry-fixture:
    if: github.ref == 'refs/heads/main' && !inputs.promote_existing
    name: Signed own-entry fixture (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release source
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "own-entry fixture requires a 40-hex source_sha" >&2
            exit 1
          fi
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Verify merged source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" origin/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up fixture package manager
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.20.0
      - name: Install fixture build and test dependencies
        run: pnpm install --filter agent-infra... --frozen-lockfile --ignore-scripts
      - name: Verify snapshot business fixture
        run: node --test tests/signed-own-entry.test.mjs tests/signed-own-entry-protocols.test.mjs tests/snapshot-business.test.mjs
      - name: Set up Docker OCI image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true,"cdi":false}}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
        with:
          driver: docker
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username github-actions --password-stdin
      - name: Build and publish the signed entry
        env:
          PLATFORM: linux/amd64
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          node deploy/release/build-images.mjs "$RUNNER_TEMP/signed-own-entry.json" --images=signedOwnEntry
      - name: Upload signed entry receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: signed-own-entry-amd64-${{ env.RELEASE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-own-entry.json

  promote-existing:
    if: github.ref == 'refs/heads/main' && inputs.promote_existing
    name: Promote verified signed entry (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Validate promotion inputs
        env:
          ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
        run: |
          [[ "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORIGIN_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify merged workflow and fixture sources
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SOURCE_SHA"
          git merge-base --is-ancestor "$WORKFLOW_SOURCE_SHA" origin/main
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" origin/main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify promotion guards
        run: node --test tests/signed-own-entry-promotion.test.mjs
      - name: Read official origin evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
        run: |
          gh run view "$ORIGIN_RUN_ID" --repo AgoraIO-Extensions/agent-infra \
            --json databaseId,headSha,status,conclusion,attempt,event,headBranch,workflowName \
            > "$RUNNER_TEMP/ownentry-origin-run.json"
          ORIGIN_ATTEMPT=""
          ORIGIN_ATTEMPT=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1])).attempt' "$RUNNER_TEMP/ownentry-origin-run.json")
          gh run download "$ORIGIN_RUN_ID" --repo AgoraIO-Extensions/agent-infra \
            --name "signed-own-entry-amd64-${RELEASE_SOURCE_SHA}-${ORIGIN_ATTEMPT}" \
            --dir "$RUNNER_TEMP/ownentry-origin"
          printf '%s' "$ORIGIN_ATTEMPT" > "$RUNNER_TEMP/ownentry-origin-attempt"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
        with:
          driver: docker
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username github-actions --password-stdin
      - name: Promote unchanged artifact
        env:
          PROMOTION_ORIGIN_RUN_ID: ${{ inputs.origin_run_id }}
          PROMOTION_ORIGIN_ATTEMPT_FILE: ${{ runner.temp }}/ownentry-origin-attempt
        run: |
          PROMOTION_ORIGIN_ATTEMPT=""
          PROMOTION_ORIGIN_ATTEMPT="$(cat "$PROMOTION_ORIGIN_ATTEMPT_FILE")"
          export PROMOTION_ORIGIN_ATTEMPT
          node deploy/release/promote-signed-own-entry.ts \
            "$RUNNER_TEMP/ownentry-origin/signed-own-entry.json" \
            "$RUNNER_TEMP/ownentry-origin-run.json" \
            "$RUNNER_TEMP/ownentry-promotion.json"
      - name: Preserve promotion receipt or unknown-copy intent
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: warn
          name: signed-own-entry-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownentry-promotion.json

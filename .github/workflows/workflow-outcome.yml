name: Workflow Outcome
run-name: >-
  ${{
    github.event.workflow_run.pull_requests[0].number &&
    format('PR #{0} | workflow-outcome | source {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.id) ||
    format('repository | workflow-outcome | source {0}', github.event.workflow_run.id)
  }}

on:
  workflow_run:
    workflows:
      - Auto-merge Enrollment
      - Blocker Reconciler
      - Claude Issue Review
      - Claude PR Review
      - Codex Worker
      - Docs CI
      - PR-Agent Review
      - PR Gates
    types: [completed]

permissions: {}

concurrency:
  group: workflow-outcome-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  observe:
    name: Record terminal workflow outcome
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Record workflow outcome and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WECOM_BOT_WEBHOOK_URL: ${{ secrets.WECOM_BOT_WEBHOOK_URL }}
        run: node .github/scripts/workflow-outcome.mjs

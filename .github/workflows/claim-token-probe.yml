name: Claim token probe
on:
  pull_request:
    types: [opened, synchronize]
permissions: {}
jobs:
  probe:
    if: github.head_ref == 'fix/4417-actions-claim-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Count ignored claims using Actions token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-gates.mjs diagnose-claim 4410

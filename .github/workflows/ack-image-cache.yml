name: ACK image cache plan
run-name: >-
  ${{ github.event_name }} | ack-image-cache-plan | main |
  ${{ github.event.workflow_run.id || inputs.publish_run_id }}
on:
  workflow_run:
    workflows: [Publish images]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful Publish images run ID
        required: false
        type: string
      publish_attempt:
        description: Exact successful attempt
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ack-image-cache-cn-hangzhou
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'AgoraIO-Extensions/agent-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ack-image-cache
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate exact publication and build cache plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
          PUBLISH_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.publish_attempt }}
        run: node deploy/ack/image-cache-release.ts "$PUBLISH_RUN_ID" "$PUBLISH_ATTEMPT" "$RUNNER_TEMP/cache-plan.json"
      - name: Upload verified cache plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ack-cache-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-plan.json
          if-no-files-found: error

  execute:
    name: Execute ACK ImageCache prewarm
    needs: prepare
    if: >-
      github.repository == 'AgoraIO-Extensions/agent-infra' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: ack-image-cache
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download verified cache plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ack-cache-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ack-cache-plan
      - name: Write temporary kubeconfig
        env:
          ACK_KUBECONFIG_B64: ${{ secrets.ACK_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$ACK_KUBECONFIG_B64"
          umask 077
          printf '%s' "$ACK_KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/ack-kubeconfig"
          test -s "$RUNNER_TEMP/ack-kubeconfig"
          chmod 600 "$RUNNER_TEMP/ack-kubeconfig"
      - name: Ensure ImageCache groups are Ready
        env:
          ACK_KUBECONFIG: ${{ runner.temp }}/ack-kubeconfig
          ACK_NAMESPACE: ${{ vars.ACK_NAMESPACE }}
          ACK_IMAGE_PULL_SECRET: ${{ vars.ACK_IMAGE_PULL_SECRET }}
          ACK_IMAGE_CACHE_SIZE_GIB: '30'
          ACK_IMAGE_CACHE_TIMEOUT_MS: '1800000'
          ACK_IMAGE_CACHE_CONCURRENCY: '6'
        run: |
          set -euo pipefail
          test -n "$ACK_NAMESPACE"
          test -n "$ACK_IMAGE_PULL_SECRET"
          ACK_SOURCE_SHA="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).sourceSha)' "$RUNNER_TEMP/ack-cache-plan/cache-plan.json")"
          export ACK_SOURCE_SHA
          node deploy/ack/image-cache.ts validate-target \
            "$RUNNER_TEMP/ack-cache-plan/cache-plan.json" \
            "$RUNNER_TEMP/cache-target.json"
          # Keep only each template's current version and this plan's version before preparing it.
          # A failed retire never stops preparation, but it fails the job.
          retire_status=0
          ACK_IMAGE_CACHE_RETIRE_CONFIRM=RETIRE_OWNED_IMAGE_CACHES node deploy/ack/image-cache.ts retire \
            "$RUNNER_TEMP/ack-cache-plan/cache-plan.json" \
            "$RUNNER_TEMP/cache-retire.json" || retire_status=$?
          if [ "$retire_status" -ne 0 ]; then
            echo "ImageCache retire failed; preparing the plan anyway and failing the job afterwards" >&2
          fi
          for attempt in 1 2 3; do
            if node deploy/ack/image-cache.ts ensure \
              "$RUNNER_TEMP/ack-cache-plan/cache-plan.json" \
              "$RUNNER_TEMP/cache-ready.json"; then
              exit "$retire_status"
            fi
            echo "ImageCache ensure attempt $attempt did not reach Ready; reusing the same CRs on the next attempt" >&2
            sleep 10
          done
          exit 1
      - name: Upload Ready receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        if: always()
        with:
          name: ack-cache-ready-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cache-target.json
            ${{ runner.temp }}/cache-ready.json
            ${{ runner.temp }}/cache-retire.json
          if-no-files-found: warn
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/ack-kubeconfig"

name: ACK image cache
run-name: >-
  ${{ github.event_name }} | ack-image-cache | main |
  ${{ inputs.request_id || github.event.workflow_run.id || inputs.publish_run_id }}
on:
  workflow_run:
    workflows: [Publish images]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful Publish images run ID
        required: false
        type: string
      publish_attempt:
        description: Exact successful attempt
        required: false
        type: string
      deployment_plan:
        description: Approved deployment image groups, immutable GHCR digests only
        required: false
        type: string
      request_id:
        description: Deployment correlation ID
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ack-image-cache-cn-hangzhou
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'AgoraIO-Extensions/agent-infra' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ack-image-cache
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate exact publication and build cache plan
        env:
          GH_TOKEN: ${{ github.token }}
          ACK_DEPLOYMENT_CACHE_PLAN: ${{ inputs.deployment_plan }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
          PUBLISH_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.publish_attempt }}
        run: node deploy/ack/image-cache-release.ts "$PUBLISH_RUN_ID" "$PUBLISH_ATTEMPT" "$RUNNER_TEMP/cache-plan.json"
      - name: Upload verified cache plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ack-cache-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cache-plan.json
          if-no-files-found: error

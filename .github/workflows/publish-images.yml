name: Publish images
run-name: >-
  ${{ github.event_name }} | publish-images | ${{ github.ref_name }} |
  ${{ github.event_name == 'workflow_dispatch' && inputs.full_release && inputs.source_sha || github.sha }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      full_release:
        description: Build Platform, standard and runtime images from one exact source commit
        required: false
        type: boolean
        default: false
      source_sha:
        description: Exact 40-hex commit to publish when full_release is enabled
        required: false
        type: string
        default: ""
      smoke:
        description: Run the two-architecture release smoke with an isolated tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.event_name == 'workflow_dispatch' && inputs.full_release && inputs.source_sha || github.sha }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY_PREFIX: ghcr.io/agoraio-extensions/agent-infra
  RELEASE_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.full_release && inputs.source_sha || github.sha }}
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke && format('smoke-{0}-{1}', github.run_id, github.run_attempt) || github.event_name == 'workflow_dispatch' && inputs.full_release && format('release-{0}', inputs.source_sha) || github.ref_name }}

jobs:
  infrastructure:
    name: Standard template images (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.smoke == true || inputs.full_release == true))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.full_release && inputs.source_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Docker OCI image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true,"cdi":false}}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username github-actions --password-stdin
      - name: Build and publish standard templates and custom base
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_SOURCE_SHA: ${{ env.RELEASE_SOURCE_SHA }}
        run: |
          if [ "${{ inputs.full_release }}" = "true" ] && ! printf '%s' "$RELEASE_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "full_release requires a 40-hex source_sha" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          node deploy/release/build-images.mjs "$RUNNER_TEMP/templates.json" \
            --images=codex,claude,opencode,pi
          node deploy/release/build-images.mjs "$RUNNER_TEMP/runtime-host.json" \
            --images=runtimeHost
          node deploy/release/build-images.mjs "$RUNNER_TEMP/custom-agent-base.json" \
            --custom-base-image
      - name: Upload template receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: warn
          name: template-images-${{ matrix.architecture }}-${{ env.RELEASE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/templates.json
            ${{ runner.temp }}/templates.json.runtime-probe.json
            ${{ runner.temp }}/runtime-host.json
            ${{ runner.temp }}/runtime-host.json.runtime-probe.json
            ${{ runner.temp }}/custom-agent-base.json

  infrastructure-index:
    name: Publish template indexes
    needs: infrastructure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.full_release && inputs.source_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download verified image receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: template-images-*-${{ env.RELEASE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username github-actions --password-stdin
      - name: Publish multi-architecture indexes
        run: |
          set -o pipefail
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node deploy/release/publish-image-indexes.mjs "$IMAGE_TAG" \
            agent-runtime-host,agent-runtime-codex,agent-runtime-claude,agent-runtime-opencode,agent-runtime-pi,custom-agent-base \
            "$RUNNER_TEMP/receipts"/*/templates.json \
            "$RUNNER_TEMP/receipts"/*/runtime-host.json \
            "$RUNNER_TEMP/receipts"/*/custom-agent-base.json \
            | tee "$RUNNER_TEMP/published-indexes.jsonl"
      - name: Upload published index receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: published-indexes-${{ env.RELEASE_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-indexes.jsonl

  platform:
    name: Platform business images (${{ matrix.platform }})
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.full_release == true)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.full_release && inputs.source_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Docker OCI image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true,"cdi":false}}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username github-actions --password-stdin
      - name: Build and publish Platform images
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_SOURCE_SHA: ${{ env.RELEASE_SOURCE_SHA }}
        run: |
          if [ "${{ inputs.full_release }}" = "true" ] && ! printf '%s' "$RELEASE_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "full_release requires a 40-hex source_sha" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          node deploy/release/build-images.mjs "$RUNNER_TEMP/platform-images.json" \
            --images=web,platformApi,platformWorker,enterpriseDirectorySync
      - name: Upload Platform receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          if-no-files-found: error
          name: platform-images-${{ matrix.architecture }}-${{ env.RELEASE_SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/platform-images.json

  platform-index:
    name: Publish Platform indexes
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.full_release == true)
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.full_release && inputs.source_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download verified image receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: platform-images-*-${{ env.RELEASE_SOURCE_SHA }}
          path: ${{ runner.temp }}/receipts
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username github-actions --password-stdin
      - name: Publish multi-architecture Platform indexes
        run: |
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node deploy/release/publish-image-indexes.mjs "$IMAGE_TAG" \
            web,platform-api,platform-worker,enterprise-directory-sync \
            "$RUNNER_TEMP/receipts"/*/platform-images.json

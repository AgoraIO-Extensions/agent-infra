name: PR-Agent Transport Smoke

on:
  push:
    branches: [test/pr-agent-post-merge-smoke]

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    name: Compare real and sanitized prompts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare trusted PR event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/95" > pr.json
          jq -n --slurpfile pr pr.json \
            '{action: "synchronize", pull_request: $pr[0]}' > event.json

      - name: Compare real and sanitized prompts
        env:
          PROBE_GITHUB_TOKEN: ${{ github.token }}
          PR_AGENT_API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          PR_AGENT_API_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          PR_AGENT_MODEL: ${{ secrets.PR_AGENT_MODEL }}
        run: |
          docker run --rm \
            -v "$PWD/event.json:/tmp/event.json:ro" \
            -e PROBE_GITHUB_TOKEN \
            -e PR_AGENT_API_BASE \
            -e PR_AGENT_API_KEY \
            -e PR_AGENT_MODEL \
            --entrypoint python \
            pragent/pr-agent:github_action \
            -c 'import asyncio
          import copy
          import os

          os.environ["GITHUB_EVENT_NAME"] = "pull_request_target"
          os.environ["GITHUB_EVENT_PATH"] = "/tmp/event.json"
          os.environ["GITHUB_TOKEN"] = os.environ["PROBE_GITHUB_TOKEN"]
          os.environ["GITHUB_OUTPUT"] = "/tmp/github-output"
          os.environ["OPENAI_KEY"] = os.environ["PR_AGENT_API_KEY"]
          os.environ["OPENAI__API_BASE"] = os.environ["PR_AGENT_API_BASE"]

          def exception_chain(error):
              chain = []
              seen = set()
              while error is not None and id(error) not in seen:
                  seen.add(id(error))
                  chain.append(type(error).__module__ + "." + type(error).__name__)
                  error = error.__cause__ or error.__context__
              return " -> ".join(chain)

          async def main():
              from pr_agent.algo.ai_handlers import litellm_ai_handler as handler_module
              from pr_agent.config_loader import get_settings
              from pr_agent.servers.github_action_runner import run_action

              settings = get_settings()
              settings.set("CONFIG.MODEL", os.environ["PR_AGENT_MODEL"])
              settings.set("CONFIG.PUBLISH_OUTPUT", False)
              settings.set("CONFIG.PUBLISH_OUTPUT_PROGRESS", False)
              settings.set("CONFIG.USE_REPO_SETTINGS_FILE", False)
              settings.set("CONFIG.USE_WIKI_SETTINGS_FILE", False)
              settings.set("CONFIG.FALLBACK_MODELS", [])
              settings.set("CONFIG.CUSTOM_MODEL_MAX_TOKENS", 128000)
              settings.set("CONFIG.PROPAGATE_TOOL_ERRORS", True)
              settings.set("CONFIG.LOG_LEVEL", "ERROR")
              settings.set("PR_REVIEWER.NUM_MAX_FINDINGS", 10)
              settings.set("PR_REVIEWER.REQUIRE_CAN_BE_SPLIT_REVIEW", False)
              settings.set("PR_REVIEWER.REQUIRE_ESTIMATE_CONTRIBUTION_TIME_COST", False)
              settings.set("PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW", False)
              settings.set("PR_REVIEWER.REQUIRE_SCORE_REVIEW", False)
              settings.set("PR_REVIEWER.REQUIRE_SECURITY_REVIEW", False)
              settings.set("PR_REVIEWER.REQUIRE_TESTS_REVIEW", False)
              settings.set("PR_REVIEWER.REQUIRE_TICKET_ANALYSIS_REVIEW", False)
              settings.set("PR_REVIEWER.REQUIRE_TODO_SCAN", False)
              settings.set("GITHUB_ACTION_CONFIG.AUTO_REVIEW", True)
              settings.set("GITHUB_ACTION_CONFIG.AUTO_DESCRIBE", False)
              settings.set("GITHUB_ACTION_CONFIG.AUTO_IMPROVE", False)
              settings.set("GITHUB_ACTION_CONFIG.ENABLE_OUTPUT", True)
              settings.set(
                  "GITHUB_ACTION_CONFIG.PR_ACTIONS",
                  ["opened", "reopened", "synchronize", "ready_for_review", "review_requested"],
              )

              original = handler_module.acompletion
              calls = 0

              async def compare_prompts(**kwargs):
                  nonlocal calls
                  calls += 1
                  messages = kwargs.get("messages") or []
                  lengths = [len(str(message.get("content", ""))) for message in messages]
                  safe_keys = sorted(key for key in kwargs if key != "api_key")
                  print(f"call={calls} keys={safe_keys} message_lengths={lengths}")
                  try:
                      response = await original(**kwargs)
                      print(f"actual_{calls}=success choices={len(response.choices or [])}")
                      return response
                  except BaseException as actual_error:
                      print(f"actual_{calls}=failure exception_chain={exception_chain(actual_error)}")
                      caught_actual_error = actual_error

                  sanitized = copy.deepcopy(kwargs)
                  sanitized["messages"] = [
                      {
                          **message,
                          "content": "A" * len(message.get("content", "")),
                      }
                      for message in messages
                  ]
                  try:
                      response = await original(**sanitized)
                      print(f"sanitized_{calls}=success choices={len(response.choices or [])}")
                      return response
                  except BaseException as sanitized_error:
                      print(
                          f"sanitized_{calls}=failure exception_chain="
                          + exception_chain(sanitized_error)
                      )
                      raise caught_actual_error

              handler_module.acompletion = compare_prompts
              try:
                  await run_action()
              except BaseException as error:
                  print("run_action=failure exception_chain=" + exception_chain(error))

          asyncio.run(main())' 2>/dev/null

      - name: Run the unmodified Action entrypoint
        env:
          PROBE_GITHUB_TOKEN: ${{ github.token }}
          PR_AGENT_API_BASE: ${{ secrets.PR_AGENT_API_BASE }}
          PR_AGENT_API_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          PR_AGENT_MODEL: ${{ secrets.PR_AGENT_MODEL }}
        run: |
          trap 'rm -f action.env' EXIT
          chmod 600 event.json
          {
            printf 'GITHUB_TOKEN=%s\n' "$PROBE_GITHUB_TOKEN"
            printf 'OPENAI_KEY=%s\n' "$PR_AGENT_API_KEY"
            printf 'OPENAI__API_BASE=%s\n' "$PR_AGENT_API_BASE"
            printf 'config.model=%s\n' "$PR_AGENT_MODEL"
          } > action.env
          chmod 600 action.env

          set +e
          docker run --rm \
            -v "$PWD/event.json:/tmp/event.json:ro" \
            --env-file action.env \
            -e GITHUB_EVENT_NAME=pull_request_target \
            -e GITHUB_EVENT_PATH=/tmp/event.json \
            -e GITHUB_OUTPUT=/tmp/github-output \
            -e 'config.publish_output=false' \
            -e 'config.publish_output_progress=false' \
            -e 'config.use_repo_settings_file=false' \
            -e 'config.use_wiki_settings_file=false' \
            -e 'config.fallback_models=[]' \
            -e 'config.custom_model_max_tokens=128000' \
            -e 'config.propagate_tool_errors=true' \
            -e 'config.log_level=ERROR' \
            -e 'pr_reviewer.num_max_findings=10' \
            -e 'pr_reviewer.require_can_be_split_review=false' \
            -e 'pr_reviewer.require_estimate_contribution_time_cost=false' \
            -e 'pr_reviewer.require_estimate_effort_to_review=false' \
            -e 'pr_reviewer.require_score_review=false' \
            -e 'pr_reviewer.require_security_review=false' \
            -e 'pr_reviewer.require_tests_review=false' \
            -e 'pr_reviewer.require_ticket_analysis_review=false' \
            -e 'pr_reviewer.require_todo_scan=false' \
            -e 'github_action_config.auto_review=true' \
            -e 'github_action_config.auto_describe=false' \
            -e 'github_action_config.auto_improve=false' \
            -e 'github_action_config.enable_output=true' \
            -e 'github_action_config.pr_actions=["opened","reopened","synchronize","ready_for_review","review_requested"]' \
            pragent/pr-agent:github_action 2>/dev/null
          status=$?
          set -e
          echo "exact_action_exit=$status"

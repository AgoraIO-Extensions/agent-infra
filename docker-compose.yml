name: agent-infra

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: connection
      POSTGRES_PASSWORD: connection
      POSTGRES_USER: connection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connection -d connection"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - connection-postgres:/var/lib/postgresql/data

volumes:
  connection-postgres:

name: agent-infra

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform-api:
    build:
      context: .
      dockerfile: apps/platform-api/Dockerfile
    init: true
    read_only: true
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform-worker:
    build:
      context: .
      dockerfile: apps/platform-worker/Dockerfile
    init: true
    read_only: true

  connection-api:
    build:
      context: .
      dockerfile: apps/connection-api/Dockerfile
    init: true
    read_only: true
    ports:
      - "3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

name: agent-infra

services:
  postgres:
    image: postgres:16-alpine
    init: true
    environment:
      POSTGRES_DB: agent_infra
      POSTGRES_PASSWORD: agent_infra_local
      POSTGRES_USER: agent_infra
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - local-topology-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_infra -d agent_infra"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    init: true
    environment:
      MINIO_ROOT_PASSWORD: agent_infra_local_storage
      MINIO_ROOT_USER: agent_infra
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - local-topology-object-storage:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform-api:
    build:
      context: .
      dockerfile: apps/platform-api/Dockerfile
    init: true
    read_only: true
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  platform-worker:
    build:
      context: .
      dockerfile: apps/platform-worker/Dockerfile
    init: true
    read_only: true

  connection-api:
    build:
      context: .
      dockerfile: apps/connection-api/Dockerfile
    init: true
    read_only: true
    ports:
      - "3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  local-topology-object-storage:
  local-topology-postgres:

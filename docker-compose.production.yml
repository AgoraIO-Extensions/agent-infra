name: agent-infra-connection-production

services:
  connection-bootstrap:
    build:
      context: .
      dockerfile: apps/connection-api/Dockerfile
    command: ["node", "dist/bootstrap-production.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    init: true
    read_only: true
    restart: "no"
    tmpfs:
      - /tmp:size=16m,mode=1777

  connection-api:
    build:
      context: .
      dockerfile: apps/connection-api/Dockerfile
    depends_on:
      connection-bootstrap:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL
      - CONNECTION_PUBLIC_BASE_URL
      - CONNECTION_IDENTITY_KEY
      - CONNECTION_CREDENTIAL_KEY
      - CONNECTION_DIRECT_CONSUMER_ID
      - CONNECTION_DIRECT_CONSUMER_NAME
      - GITHUB_OAUTH_CLIENT_ID
      - GITHUB_OAUTH_CLIENT_SECRET
      - GITHUB_OAUTH_AUTHORIZATION_URL
      - GITHUB_OAUTH_TOKEN_URL
      - JIRA_TOKEN_SERVER_URL
      - JIRA_TOKEN_CLIENT_ID
      - JIRA_TOKEN_CLIENT_SECRET
      - JIRA_TOKEN_USERNAME
      - JIRA_TOKEN_PASSWORD
      - LDAP_URL
      - LDAP_ISSUER
      - LDAP_USERS_BASE_DN
      - LDAP_SERVICE_BIND_DN
      - LDAP_SERVICE_BIND_PASSWORD
      - LDAP_USERNAME_ATTRIBUTE
      - LDAP_UID_ATTRIBUTE
      - LDAP_EMAIL_ATTRIBUTE
      - LDAP_DISPLAY_NAME_ATTRIBUTE
      - LDAP_ACTIVE_ATTRIBUTE
      - LDAP_ACTIVE_VALUE
      - LDAP_CONNECT_TIMEOUT_MS
      - LDAP_OPERATION_TIMEOUT_MS
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  connection-web:
    build:
      context: .
      dockerfile: apps/connection-web/Dockerfile
    depends_on:
      connection-api:
        condition: service_healthy
    ports:
      - "${CONNECTION_WEB_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
